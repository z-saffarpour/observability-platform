# Uses PowerShell / Windows User environment variables.
# Before up, open a NEW terminal (or restart Docker Desktop if vars were just set).
#
# Expected User env vars:
#   GRAFANA_URL
#   GRAFANA_SERVICE_ACCOUNT_TOKEN
#   PROMETHEUS_URL
#
# Run (from this folder):
#   cd <repository>\mcp
#   foreach ($n in @('GRAFANA_URL','GRAFANA_SERVICE_ACCOUNT_TOKEN','PROMETHEUS_URL')) {
#     Set-Item Env:$n ([System.Environment]::GetEnvironmentVariable($n,'User'))
#   }
#   docker compose -f docker-compose.mcp.env.yml up -d
#
# Note: the published host port (8101) must be in --allowed-hosts,
# otherwise Cursor gets: forbidden: host not allowed

services:
  grafana:
    image: grafana/mcp-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8000"
    environment:
      GRAFANA_URL: ${GRAFANA_URL:?GRAFANA_URL is required}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:?GRAFANA_SERVICE_ACCOUNT_TOKEN is required}
    command:
      - "-t"
      - "streamable-http"
      - "--address"
      - "0.0.0.0:8000"
      - "--allowed-hosts"
      - "127.0.0.1:8101,localhost:8101,127.0.0.1:8000,localhost:8000"
      - "--allowed-origins"
      - "*"

  prometheus:
    image: ghcr.io/pab1it0/prometheus-mcp-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8103:8080"
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:?PROMETHEUS_URL is required}
      PROMETHEUS_MCP_SERVER_TRANSPORT: http
      PROMETHEUS_MCP_BIND_HOST: "0.0.0.0"
      PROMETHEUS_MCP_BIND_PORT: "8080"
