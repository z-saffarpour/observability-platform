services:
  target-manager-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: target_manager
      POSTGRES_USER: target_manager
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - target_manager_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target_manager -d target_manager"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  target-manager:
    build: .
    restart: unless-stopped
    depends_on:
      target-manager-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://target_manager:${DB_PASSWORD:?Set DB_PASSWORD}@target-manager-db:5432/target_manager
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

volumes:
  target_manager_pgdata:

networks:
  internal:
