# Generated by scripts/powershell/alertmanager/Build-AlertmanagerConfig.ps1.
# Edit alertmanager/exporters.json and each exporter alertmanager.yml, then rerun the script.
# One Alertmanager process loads this file.

global:
  resolve_timeout: 5m
  smtp_smarthost: "CHANGE_ME_SMTP_HOST:587"
  smtp_from: "CHANGE_ME_ALERTS_FROM@example.com"
  smtp_auth_username: "CHANGE_ME_SMTP_USER"
  smtp_auth_password: "CHANGE_ME_SMTP_PASSWORD"
  smtp_require_tls: true
  smtp_tls_config:
    insecure_skip_verify: true


templates:
  - "templates/*.tmpl"

route:
  receiver: email-p2
  group_by: [owner, priority, alertname, instance, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - job =~ "sql_exporter.*"
      receiver: sql_exporter-email-p2
      group_by: [owner, priority, alertname, instance, db, job]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      continue: false
      routes:
        # P3 stays in the alert list and sends no SMS or email.
        # This route is first so an owner route cannot send it.
        - matchers:
            - priority = "P3"
          receiver: none
          continue: false

        - matchers:
            - owner = "FMR-DBA"
          receiver: sql_exporter-email-p2-fmr-dba
          continue: false
          routes:
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceCritical"
              receiver: sql_exporter-sms-email-p0-fmr-dba
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceLow"
              receiver: sql_exporter-email-sms-p1-fmr-dba
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            # Stays open while the next run is in progress. Resolve is sent only
            # after a successful run. 12h repeat avoids a second failure SMS.
            - matchers:
                - alertname = "SqlAgentJobFailed"
              receiver: sql_exporter-sms-email-p0-fmr-dba-job-failed
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 12h
            - matchers:
                - priority = "P0"
              receiver: sql_exporter-sms-email-p0-fmr-dba
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - priority = "P1"
              receiver: sql_exporter-email-sms-p1-fmr-dba
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            - matchers:
                - priority = "P2"
              receiver: sql_exporter-email-p2-fmr-dba
              group_wait: 1m
              group_interval: 15m
              repeat_interval: 12h

        - matchers:
            - owner = "OK-DBA"
          receiver: sql_exporter-email-p2-ok-dba
          continue: false
          routes:
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceCritical"
              receiver: sql_exporter-sms-email-p0-ok-dba
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceLow"
              receiver: sql_exporter-email-sms-p1-ok-dba
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            # Stays open while the next run is in progress. Resolve is sent only
            # after a successful run. 12h repeat avoids a second failure SMS.
            - matchers:
                - alertname = "SqlAgentJobFailed"
              receiver: sql_exporter-sms-email-p0-ok-dba-job-failed
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 12h
            - matchers:
                - priority = "P0"
              receiver: sql_exporter-sms-email-p0-ok-dba
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - priority = "P1"
              receiver: sql_exporter-email-sms-p1-ok-dba
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            - matchers:
                - priority = "P2"
              receiver: sql_exporter-email-p2-ok-dba
              group_wait: 1m
              group_interval: 15m
              repeat_interval: 12h

        - matchers:
            - owner = "FMR-BI-Develop"
          receiver: sql_exporter-email-p2-fmr-bi-develop
          continue: false
          routes:
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceCritical"
              receiver: sql_exporter-sms-email-p0-fmr-bi-develop
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceLow"
              receiver: sql_exporter-email-sms-p1-fmr-bi-develop
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            # Stays open while the next run is in progress. Resolve is sent only
            # after a successful run. 12h repeat avoids a second failure SMS.
            - matchers:
                - alertname = "SqlAgentJobFailed"
              receiver: sql_exporter-sms-email-p0-fmr-bi-develop-job-failed
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 12h
            - matchers:
                - priority = "P0"
              receiver: sql_exporter-sms-email-p0-fmr-bi-develop
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - priority = "P1"
              receiver: sql_exporter-email-sms-p1-fmr-bi-develop
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            - matchers:
                - priority = "P2"
              receiver: sql_exporter-email-p2-fmr-bi-develop
              group_wait: 1m
              group_interval: 15m
              repeat_interval: 12h

        - matchers:
            - owner = "OK-BI-Develop"
          receiver: sql_exporter-email-p2-ok-bi-develop
          continue: false
          routes:
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceCritical"
              receiver: sql_exporter-sms-email-p0-ok-bi-develop
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - alertname = "SqlFilegroupFreeSpaceLow"
              receiver: sql_exporter-email-sms-p1-ok-bi-develop
              group_by: [owner, priority, alertname, instance, db, filegroup]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            # Stays open while the next run is in progress. Resolve is sent only
            # after a successful run. 12h repeat avoids a second failure SMS.
            - matchers:
                - alertname = "SqlAgentJobFailed"
              receiver: sql_exporter-sms-email-p0-ok-bi-develop-job-failed
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 12h
            - matchers:
                - priority = "P0"
              receiver: sql_exporter-sms-email-p0-ok-bi-develop
              group_wait: 0s
              group_interval: 2m
              repeat_interval: 15m
            - matchers:
                - priority = "P1"
              receiver: sql_exporter-email-sms-p1-ok-bi-develop
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
            - matchers:
                - priority = "P2"
              receiver: sql_exporter-email-p2-ok-bi-develop
              group_wait: 1m
              group_interval: 15m
              repeat_interval: 12h

        # Unknown owner keeps the shared mailbox. Do not drop the alert.
        # Stays open while the next run is in progress. Resolve is sent only
        # after a successful run. 12h repeat avoids a second failure SMS.
        - matchers:
            - alertname = "SqlAgentJobFailed"
          receiver: sql_exporter-sms-email-p0-job-failed
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 12h
          continue: false

        - matchers:
            - priority = "P0"
          receiver: sql_exporter-sms-email-p0
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
          continue: false

        - matchers:
            - priority = "P1"
          receiver: sql_exporter-email-sms-p1
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
          continue: false

        - matchers:
            - priority = "P2"
          receiver: sql_exporter-email-p2
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h
          continue: false

    # P3 stays in the alert list and sends no SMS or email.
    # This route is first so an owner route cannot send it.
    - matchers:
        - priority = "P3"
      receiver: none
      continue: false

    - matchers:
        - owner = "FMR-DBA"
      receiver: email-p2-fmr-dba
      continue: false
      routes:
        # Disk runway is a multi-day condition. The first notice is still
        # prompt; repeats stay at 12h (under 3 days) and 24h (under 14 days).
        # DiskSpaceCritical repeats hourly and DiskSpaceLow every 4h.
        # The first notice for both is still prompt. Outage routes below
        # keep the 15m P0 repeat.
        - &disk-runway-critical
          matchers:
            - alertname =~ "WindowsOlapDiskFreeSpaceCritical|WindowsBackupDiskFreeSpaceCritical"
          receiver: sms-email-p0-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 30s
          group_interval: 12h
          repeat_interval: 12h
        - &disk-runway-warning
          matchers:
            - alertname =~ "WindowsOlapDiskFreeSpaceLow|WindowsBackupDiskFreeSpaceLow"
          receiver: email-sms-p1-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 30s
          group_interval: 24h
          repeat_interval: 24h
        - &disk-space-critical
          matchers:
            - alertname =~ "Windows.*DiskSpaceCritical"
          receiver: sms-email-p0-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 0s
          group_interval: 1h
          repeat_interval: 1h
        - &disk-space-low
          matchers:
            - alertname =~ "Windows.*DiskSpaceLow"
          receiver: email-sms-p1-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 30s
          group_interval: 4h
          repeat_interval: 4h
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-fmr-dba
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-fmr-dba
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-fmr-dba
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "OK-DBA"
      receiver: email-p2-ok-dba
      continue: false
      routes:
        - <<: *disk-runway-critical
          receiver: sms-email-p0-ok-dba
        - <<: *disk-runway-warning
          receiver: email-sms-p1-ok-dba
        - <<: *disk-space-critical
          receiver: sms-email-p0-ok-dba
        - <<: *disk-space-low
          receiver: email-sms-p1-ok-dba
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-ok-dba
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-ok-dba
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-ok-dba
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "FMR-BI-Develop"
      receiver: email-p2-fmr-bi-develop
      continue: false
      routes:
        - <<: *disk-runway-critical
          receiver: sms-email-p0-fmr-bi-develop
        - <<: *disk-runway-warning
          receiver: email-sms-p1-fmr-bi-develop
        - <<: *disk-space-critical
          receiver: sms-email-p0-fmr-bi-develop
        - <<: *disk-space-low
          receiver: email-sms-p1-fmr-bi-develop
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-fmr-bi-develop
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-fmr-bi-develop
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-fmr-bi-develop
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "OK-BI-Develop"
      receiver: email-p2-ok-bi-develop
      continue: false
      routes:
        - <<: *disk-runway-critical
          receiver: sms-email-p0-ok-bi-develop
        - <<: *disk-runway-warning
          receiver: email-sms-p1-ok-bi-develop
        - <<: *disk-space-critical
          receiver: sms-email-p0-ok-bi-develop
        - <<: *disk-space-low
          receiver: email-sms-p1-ok-bi-develop
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-ok-bi-develop
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-ok-bi-develop
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-ok-bi-develop
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    # Unknown owner keeps the shared mailbox. Do not drop the alert.
    - <<: *disk-runway-critical
      receiver: sms-email-p0
      continue: false
    - <<: *disk-runway-warning
      receiver: email-sms-p1
      continue: false
    - <<: *disk-space-critical
      receiver: sms-email-p0
      continue: false
    - <<: *disk-space-low
      receiver: email-sms-p1
      continue: false
    - matchers:
        - priority = "P0"
      receiver: sms-email-p0
      group_wait: 0s
      group_interval: 2m
      repeat_interval: 15m
      continue: false

    # P1 — Email always; SMS optional via same webhook (shorter repeat than P2)
    - matchers:
        - priority = "P1"
      receiver: email-sms-p1
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      continue: false

    # P2 — Email only (no SMS noise)
    - matchers:
        - priority = "P2"
      receiver: email-p2
      group_wait: 1m
      group_interval: 15m
      repeat_interval: 12h
      continue: false


inhibit_rules:
  # Zero free physical memory already pages as MemoryExhausted.
  - source_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "MemoryExhausted"
    target_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "MemoryLow"
    equal: [instance]

  # SQL engine, Agent, and Power BI pages use their own alerts.
  - source_matchers:
      - job =~ "sql_exporter.*"
      - alertname =~ "SqlServerDown|SqlServerAgentDown|PowerBIDown"
    target_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "DataPlatformServiceNotRunning"
    equal: [instance, name]

  # Both exporters down is already paged as InstanceDown.
  - source_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "InstanceDown"
    target_matchers:
      - job =~ "sql_exporter.*"
      - alertname =~ "WindowsExporterDown|SqlExporterDown"
    equal: [instance]

  # P0 suppresses the same alertname at lower priority for the same server and database.
  # Server-level alerts have an empty db label and still inhibit each other.
  - source_matchers:
      - job =~ "sql_exporter.*"
      - priority = "P0"
    target_matchers:
      - job =~ "sql_exporter.*"
      - priority =~ "P1|P2|P3"
    equal: [alertname, instance, db]

  # Critical severity suppresses warning for the same alert, server, and database.
  - source_matchers:
      - job =~ "sql_exporter.*"
      - severity = "critical"
    target_matchers:
      - job =~ "sql_exporter.*"
      - severity = "warning"
    equal: [alertname, instance, db]

  # Filegroup P0 suppresses the 14-day warning for the same filegroup
  - source_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "SqlFilegroupFreeSpaceCritical"
    target_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "SqlFilegroupFreeSpaceLow"
    equal: [instance, db, filegroup]

  # Critical log growth suppresses the 10% warning for the same database
  - source_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "SqlDatabaseLogGrowthCritical"
    target_matchers:
      - job =~ "sql_exporter.*"
      - alertname = "SqlDatabaseLogGrowthHigh"
    equal: [instance, db]

  # Zero free physical memory already pages as MemoryExhausted.
  - source_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "MemoryExhausted"
    target_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "MemoryLow"
    equal: [instance]

  # SQL engine, Agent, and Power BI pages use their own alerts.
  - source_matchers:
      - job !~ "sql_exporter.*"
      - alertname =~ "SqlServerDown|SqlServerAgentDown|PowerBIDown"
    target_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "DataPlatformServiceNotRunning"
    equal: [instance, name]

  # Both exporters down is already paged as InstanceDown.
  # inhibit-scope: global
  - source_matchers:
      - alertname = "InstanceDown"
    target_matchers:
      - alertname =~ "WindowsExporterDown|SqlExporterDown"
    equal: [instance]

  # Critical P0 suppresses same alertname at lower priority on the same instance
  - source_matchers:
      - job !~ "sql_exporter.*"
      - priority = "P0"
    target_matchers:
      - job !~ "sql_exporter.*"
      - priority =~ "P1|P2"
    equal: [alertname, instance]

  # Critical severity suppresses warning for the same alert/instance
  - source_matchers:
      - job !~ "sql_exporter.*"
      - severity = "critical"
    target_matchers:
      - job !~ "sql_exporter.*"
      - severity = "warning"
    equal: [alertname, instance]

  # OLAP P0 suppresses the 14-day warning for the same volume
  - source_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "WindowsOlapDiskFreeSpaceCritical"
    target_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "WindowsOlapDiskFreeSpaceLow"
    equal: [instance, volume]

  # Backup runway P0 suppresses the 14-day warning for the same volume.
  - source_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "WindowsBackupDiskFreeSpaceCritical"
    target_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "WindowsBackupDiskFreeSpaceLow"
    equal: [instance, volume]

  # A firing runway alert already pages this U: volume.
  - source_matchers:
      - job !~ "sql_exporter.*"
      - alertname =~ "WindowsBackupDiskFreeSpaceCritical|WindowsBackupDiskFreeSpaceLow"
    target_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "WindowsBackupDiskFreeCritical"
    equal: [instance, volume]

  # Disk P0 suppresses the 10% warning for the same volume.
  # The generic inhibit matches alertname, so Low and Critical would both notify.
  # Role alerts are separate alertnames and must inhibit Low themselves.
  - source_matchers:
      - job !~ "sql_exporter.*"
      - alertname =~ "WindowsDiskSpaceCritical|WindowsSqlDataDiskSpaceCritical|WindowsSqlTempdbDataDiskSpaceCritical|WindowsOlapDataDiskSpaceCritical|WindowsSqlTempdbLogDiskSpaceCritical|WindowsSqlLogDiskSpaceCritical|WindowsSqlBackupDiskSpaceCritical"
    target_matchers:
      - job !~ "sql_exporter.*"
      - alertname =~ "WindowsDiskSpaceLow|WindowsSqlDataDiskSpaceLow|WindowsSqlTempdbDataDiskSpaceLow|WindowsOlapDataDiskSpaceLow|WindowsSqlTempdbLogDiskSpaceLow|WindowsSqlLogDiskSpaceLow|WindowsSqlBackupDiskSpaceLow"
    equal: [instance, volume]

  # SQL Backup below 5% and 30GiB pages as WindowsSqlBackupDiskSpaceCritical.
  # Suppress the backup 10% page so the owner is not paged twice.
  - source_matchers:
      - job !~ "sql_exporter.*"
      - alertname =~ "WindowsDiskSpaceCritical|WindowsSqlBackupDiskSpaceCritical"
    target_matchers:
      - job !~ "sql_exporter.*"
      - alertname = "WindowsBackupDiskFreeCritical"
    equal: [instance, volume]
    


receivers:
  - name: sql_exporter-sms-email-p0-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P0][sql_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}{{ with .GroupLabels.db }}/{{ . }}{{ end }}'
        html: '{{ template "email.sql_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-DBA"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: sql_exporter-sms-email-p0-fmr-dba-job-failed
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P0][sql_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}{{ with .GroupLabels.db }}/{{ . }}{{ end }}'
        html: '{{ template "email.sql_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-DBA"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: sql_exporter-email-sms-p1-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P1][sql_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}{{ with .GroupLabels.db }}/{{ . }}{{ end }}'
        html: '{{ template "email.sql_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-DBA"
        send_resolved: false
        max_alerts: 10

  - name: sql_exporter-email-p2-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P2][sql_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}{{ with .GroupLabels.db }}/{{ . }}{{ end }}'
        html: '{{ template "email.sql_exporter.html" . }}'

  - name: sql_exporter-sms-email-p0-ok-dba
    email_configs:
      - to: "CHANGE_ME_OK_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P0][sql_exporter][OK-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}{{ with .GroupLabels.db }}/{{ . }}{{ end }}'
