# Alertmanager config for windows_exporter priority routing (P0 / P1 / P2).
#
# Channels:
#   - Email  → native email_configs (SMTP)
#   - SMS    → webhook_configs pointing at your SMS gateway / notifier
#
# Replace CHANGE_ME_* placeholders before production use.
# Wire Prometheus with:
#   alerting:
#     alertmanagers:
#       - static_configs:
#           - targets: ["alertmanager:9093"]

global:
  resolve_timeout: 5m
  smtp_smarthost: "CHANGE_ME_SMTP_HOST:587"
  smtp_from: "CHANGE_ME_ALERTS_FROM@example.com"
  smtp_auth_username: "CHANGE_ME_SMTP_USER"
  smtp_auth_password: "CHANGE_ME_SMTP_PASSWORD"
  smtp_require_tls: true

templates:
  - "templates/*.tmpl"

# Owner routes send that team's servers to that team's mailbox and SMS gateway.
# Replace CHANGE_ME_<OWNER>_EMAIL. Several addresses go in one `to`, separated
# by commas. SMS numbers are the phones list in sms-gateway.json. The ?owner=
# value selects that owner's numbers. Unknown owners stay on the shared receivers.
route:
  receiver: email-p2
  group_by: [owner, priority, alertname, instance, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - owner = "FMR-DBA"
      receiver: email-p2-fmr-dba
      continue: false
      routes:
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-fmr-dba
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-fmr-dba
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-fmr-dba
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "OK-DBA"
      receiver: email-p2-ok-dba
      continue: false
      routes:
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-ok-dba
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-ok-dba
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-ok-dba
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "FMR-BI-Develop"
      receiver: email-p2-fmr-bi-develop
      continue: false
      routes:
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-fmr-bi-develop
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-fmr-bi-develop
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-fmr-bi-develop
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "OK-BI-Develop"
      receiver: email-p2-ok-bi-develop
      continue: false
      routes:
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-ok-bi-develop
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-ok-bi-develop
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-ok-bi-develop
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    # Unknown owner keeps the shared mailbox. Do not drop the alert.
    - matchers:
        - priority = "P0"
      receiver: sms-email-p0
      group_wait: 0s
      group_interval: 2m
      repeat_interval: 15m
      continue: false

    # P1 — Email always; SMS optional via same webhook (shorter repeat than P2)
    - matchers:
        - priority = "P1"
      receiver: email-sms-p1
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      continue: false

    # P2 — Email only (no SMS noise)
    - matchers:
        - priority = "P2"
      receiver: email-p2
      group_wait: 1m
      group_interval: 15m
      repeat_interval: 12h
      continue: false

inhibit_rules:
  # Critical P0 suppresses same alertname at lower priority on the same instance
  - source_matchers:
      - priority = "P0"
    target_matchers:
      - priority =~ "P1|P2"
    equal: [alertname, instance]

  # Critical severity suppresses warning for the same alert/instance
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname, instance]

  # OLAP P0 suppresses the 14-day warning for the same volume
  - source_matchers:
      - alertname = "WindowsOlapDiskFreeSpaceCritical"
    target_matchers:
      - alertname = "WindowsOlapDiskFreeSpaceLow"
    equal: [instance, volume]

receivers:
  - name: sms-email-p0-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P0][windows_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-DBA"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: email-sms-p1-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P1][windows_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-DBA"
        send_resolved: false
        max_alerts: 10

  - name: email-p2-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P2][windows_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'

  - name: sms-email-p0-ok-dba
    email_configs:
      - to: "CHANGE_ME_OK_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P0][windows_exporter][OK-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=OK-DBA"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: email-sms-p1-ok-dba
    email_configs:
      - to: "CHANGE_ME_OK_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P1][windows_exporter][OK-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=OK-DBA"
        send_resolved: false
        max_alerts: 10

  - name: email-p2-ok-dba
    email_configs:
      - to: "CHANGE_ME_OK_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P2][windows_exporter][OK-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'

  - name: sms-email-p0-fmr-bi-develop
    email_configs:
      - to: "CHANGE_ME_FMR_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P0][windows_exporter][FMR-BI-Develop] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-BI-Develop"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: email-sms-p1-fmr-bi-develop
    email_configs:
      - to: "CHANGE_ME_FMR_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P1][windows_exporter][FMR-BI-Develop] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-BI-Develop"
        send_resolved: false
        max_alerts: 10

  - name: email-p2-fmr-bi-develop
    email_configs:
      - to: "CHANGE_ME_FMR_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P2][windows_exporter][FMR-BI-Develop] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'

  - name: sms-email-p0-ok-bi-develop
    email_configs:
      - to: "CHANGE_ME_OK_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P0][windows_exporter][OK-BI-Develop] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=OK-BI-Develop"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: email-sms-p1-ok-bi-develop
    email_configs:
      - to: "CHANGE_ME_OK_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
