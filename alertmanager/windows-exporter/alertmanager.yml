        html: '{{ template "email.windows_exporter.html" . }}'

  - name: sms-email-p0-fmr-bi-develop
    email_configs:
      - to: "CHANGE_ME_FMR_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P0][windows_exporter][FMR-BI-Develop] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}'
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-BI-Develop"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: email-sms-p1-fmr-bi-develop
    email_configs:
      - to: "CHANGE_ME_FMR_BI_DEVELOP_EMAIL@example.com"
