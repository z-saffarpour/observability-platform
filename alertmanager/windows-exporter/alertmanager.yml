# Alertmanager config for windows_exporter priority routing (P0 / P1 / P2 / P3).
# Source for the single Alertmanager. Register it in alertmanager/exporters.json
# and rebuild with scripts/powershell/alertmanager/Build-AlertmanagerConfig.ps1.
#
# Channels:
#   - Email  → native email_configs (SMTP)
#   - SMS    → webhook_configs pointing at your SMS gateway / notifier
#
# Replace CHANGE_ME_* placeholders before production use.
# Wire Prometheus with:
#   alerting:
#     alertmanagers:
#       - static_configs:
#           - targets: ["alertmanager:9093"]

global:
  resolve_timeout: 5m
  smtp_smarthost: "CHANGE_ME_SMTP_HOST:587"
  smtp_from: "CHANGE_ME_ALERTS_FROM@example.com"
  smtp_auth_username: "CHANGE_ME_SMTP_USER"
  smtp_auth_password: "CHANGE_ME_SMTP_PASSWORD"
  smtp_require_tls: true
  smtp_tls_config:
    insecure_skip_verify: true

templates:
  - "templates/*.tmpl"

# Owner routes send that team's servers to that team's mailbox and SMS gateway.
# Replace CHANGE_ME_<OWNER>_EMAIL. Several addresses go in one `to`, separated
# by commas. SMS numbers are the phones list in sms-gateway.json. The ?owner=
# value selects that owner's numbers. Unknown owners stay on the shared receivers.
route:
  receiver: email-p2
  group_by: [owner, priority, alertname, instance, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # P3 stays in the alert list and sends no SMS or email.
    # This route is first so an owner route cannot send it.
    - matchers:
        - priority = "P3"
      receiver: none
      continue: false

    - matchers:
        - owner = "FMR-DBA"
      receiver: email-p2-fmr-dba
      continue: false
      routes:
        # Disk runway is a multi-day condition. The first notice is still
        # prompt; repeats stay at 12h (under 3 days) and 24h (under 14 days).
        # DiskSpaceCritical repeats hourly and DiskSpaceLow every 4h.
        # The first notice for both is still prompt. Outage routes below
        # keep the 15m P0 repeat.
        - &disk-runway-critical
          matchers:
            - alertname =~ "WindowsOlapDiskFreeSpaceCritical|WindowsBackupDiskFreeSpaceCritical"
          receiver: sms-email-p0-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 30s
          group_interval: 12h
          repeat_interval: 12h
        - &disk-runway-warning
          matchers:
            - alertname =~ "WindowsOlapDiskFreeSpaceLow|WindowsBackupDiskFreeSpaceLow"
          receiver: email-sms-p1-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 30s
          group_interval: 24h
          repeat_interval: 24h
        - &disk-space-critical
          matchers:
            - alertname =~ "Windows.*DiskSpaceCritical"
          receiver: sms-email-p0-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 0s
          group_interval: 1h
          repeat_interval: 1h
        - &disk-space-low
          matchers:
            - alertname =~ "Windows.*DiskSpaceLow"
          receiver: email-sms-p1-fmr-dba
          group_by: [owner, priority, alertname, instance, volume]
          group_wait: 30s
          group_interval: 4h
          repeat_interval: 4h
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-fmr-dba
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-fmr-dba
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-fmr-dba
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "OK-DBA"
      receiver: email-p2-ok-dba
      continue: false
      routes:
        - <<: *disk-runway-critical
          receiver: sms-email-p0-ok-dba
        - <<: *disk-runway-warning
          receiver: email-sms-p1-ok-dba
        - <<: *disk-space-critical
          receiver: sms-email-p0-ok-dba
        - <<: *disk-space-low
          receiver: email-sms-p1-ok-dba
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-ok-dba
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-ok-dba
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-ok-dba
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "FMR-BI-Develop"
      receiver: email-p2-fmr-bi-develop
      continue: false
      routes:
        - <<: *disk-runway-critical
          receiver: sms-email-p0-fmr-bi-develop
        - <<: *disk-runway-warning
          receiver: email-sms-p1-fmr-bi-develop
        - <<: *disk-space-critical
          receiver: sms-email-p0-fmr-bi-develop
        - <<: *disk-space-low
          receiver: email-sms-p1-fmr-bi-develop
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-fmr-bi-develop
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-fmr-bi-develop
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-fmr-bi-develop
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    - matchers:
        - owner = "OK-BI-Develop"
      receiver: email-p2-ok-bi-develop
      continue: false
      routes:
        - <<: *disk-runway-critical
          receiver: sms-email-p0-ok-bi-develop
        - <<: *disk-runway-warning
          receiver: email-sms-p1-ok-bi-develop
        - <<: *disk-space-critical
          receiver: sms-email-p0-ok-bi-develop
        - <<: *disk-space-low
          receiver: email-sms-p1-ok-bi-develop
        - matchers:
            - priority = "P0"
          receiver: sms-email-p0-ok-bi-develop
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 15m
        - matchers:
            - priority = "P1"
          receiver: email-sms-p1-ok-bi-develop
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - priority = "P2"
          receiver: email-p2-ok-bi-develop
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 12h

    # Unknown owner keeps the shared mailbox. Do not drop the alert.
    - <<: *disk-runway-critical
      receiver: sms-email-p0
      continue: false
    - <<: *disk-runway-warning
      receiver: email-sms-p1
      continue: false
    - <<: *disk-space-critical
      receiver: sms-email-p0
      continue: false
    - <<: *disk-space-low
      receiver: email-sms-p1
      continue: false
    - matchers:
        - priority = "P0"
      receiver: sms-email-p0
      group_wait: 0s
      group_interval: 2m
      repeat_interval: 15m
      continue: false

    # P1 — Email always; SMS optional via same webhook (shorter repeat than P2)
    - matchers:
        - priority = "P1"
      receiver: email-sms-p1
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      continue: false

    # P2 — Email only (no SMS noise)
    - matchers:
        - priority = "P2"
      receiver: email-p2
      group_wait: 1m
      group_interval: 15m
      repeat_interval: 12h
      continue: false

inhibit_rules:
  # Zero free physical memory already pages as MemoryExhausted.
  - source_matchers:
      - alertname = "MemoryExhausted"
    target_matchers:
      - alertname = "MemoryLow"
    equal: [instance]

  # SQL engine, Agent, and Power BI pages use their own alerts.
  - source_matchers:
      - alertname =~ "SqlServerDown|SqlServerAgentDown|PowerBIDown"
    target_matchers:
      - alertname = "DataPlatformServiceNotRunning"
    equal: [instance, name]

  # Both exporters down is already paged as InstanceDown.
  # inhibit-scope: global
  - source_matchers:
      - alertname = "InstanceDown"
    target_matchers:
      - alertname =~ "WindowsExporterDown|SqlExporterDown"
    equal: [instance]

  # Critical P0 suppresses same alertname at lower priority on the same instance
  - source_matchers:
      - priority = "P0"
    target_matchers:
      - priority =~ "P1|P2"
    equal: [alertname, instance]

  # Critical severity suppresses warning for the same alert/instance
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname, instance]

  # OLAP P0 suppresses the 14-day warning for the same volume
  - source_matchers:
      - alertname = "WindowsOlapDiskFreeSpaceCritical"
    target_matchers:
      - alertname = "WindowsOlapDiskFreeSpaceLow"
    equal: [instance, volume]

  # Backup runway P0 suppresses the 14-day warning for the same volume.
  - source_matchers:
      - alertname = "WindowsBackupDiskFreeSpaceCritical"
    target_matchers:
      - alertname = "WindowsBackupDiskFreeSpaceLow"
    equal: [instance, volume]

  # A firing runway alert already pages this U: volume.
  - source_matchers:
      - alertname =~ "WindowsBackupDiskFreeSpaceCritical|WindowsBackupDiskFreeSpaceLow"
    target_matchers:
      - alertname = "WindowsBackupDiskFreeCritical"
    equal: [instance, volume]

  # Disk P0 suppresses the 10% warning for the same volume.
  # The generic inhibit matches alertname, so Low and Critical would both notify.
  # Role alerts are separate alertnames and must inhibit Low themselves.
  - source_matchers:
      - alertname =~ "WindowsDiskSpaceCritical|WindowsSqlDataDiskSpaceCritical|WindowsSqlTempdbDataDiskSpaceCritical|WindowsOlapDataDiskSpaceCritical|WindowsSqlTempdbLogDiskSpaceCritical|WindowsSqlLogDiskSpaceCritical|WindowsSqlBackupDiskSpaceCritical"
    target_matchers:
      - alertname =~ "WindowsDiskSpaceLow|WindowsSqlDataDiskSpaceLow|WindowsSqlTempdbDataDiskSpaceLow|WindowsOlapDataDiskSpaceLow|WindowsSqlTempdbLogDiskSpaceLow|WindowsSqlLogDiskSpaceLow|WindowsSqlBackupDiskSpaceLow"
    equal: [instance, volume]

  # SQL Backup below 5% and 30GiB pages as WindowsSqlBackupDiskSpaceCritical.
  # Suppress the backup 10% page so the owner is not paged twice.
  - source_matchers:
      - alertname =~ "WindowsDiskSpaceCritical|WindowsSqlBackupDiskSpaceCritical"
    target_matchers:
      - alertname = "WindowsBackupDiskFreeCritical"
    equal: [instance, volume]
    

receivers:
  - name: sms-email-p0-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P0][windows_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}'
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-DBA"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: email-sms-p1-fmr-dba
    email_configs:
      - to: "CHANGE_ME_FMR_DBA_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P1][windows_exporter][FMR-DBA] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}'
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      - url: "http://127.0.0.1:49177/sendsms?owner=FMR-DBA"
        send_resolved: false
        max_alerts: 10

  - name: email-p2-fmr-dba
    email_configs:
