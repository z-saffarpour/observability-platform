        send_resolved: false
        max_alerts: 10

  - name: email-p2-ok-bi-develop
    email_configs:
      - to: "CHANGE_ME_OK_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P2][windows_exporter][OK-BI-Develop] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}'
        html: '{{ template "email.windows_exporter.html" . }}'

  - name: sms-email-p0
    email_configs:
      - to: "CHANGE_ME_P0_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P0][windows_exporter] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}'
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      # SMS gateway / custom notifier. Expected to accept Alertmanager webhook JSON.
      # Example body fields: commonLabels.priority, commonLabels.alertname, commonLabels.instance
      - url: "http://127.0.0.1:49177/sendsms"
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 0

  - name: email-sms-p1
