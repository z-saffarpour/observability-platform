  - name: email-p2-ok-bi-develop
    email_configs:
      - to: "CHANGE_ME_OK_BI_DEVELOP_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: "[P2][windows_exporter][OK-BI-Develop] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}"
