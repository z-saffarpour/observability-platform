      - to: "CHANGE_ME_P1_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P1][windows_exporter] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}'
        html: '{{ template "email.windows_exporter.html" . }}'
    webhook_configs:
      # Keep SMS for P1 if your gateway supports priority filtering; otherwise remove this block.
      - url: "http://127.0.0.1:49177/sendsms"
        send_resolved: false
        max_alerts: 10

  - name: email-p2
    email_configs:
      - to: "CHANGE_ME_P2_EMAIL@example.com"
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[P2][windows_exporter] {{ .GroupLabels.alertname }} — {{ .GroupLabels.instance }}'
        html: '{{ template "email.windows_exporter.html" . }}'

  # Keeps the alert in Alertmanager and sends no SMS or email.
  - name: none
