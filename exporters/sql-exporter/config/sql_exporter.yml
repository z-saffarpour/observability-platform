# Global defaults.
global:
  # Export per-query duration and returned-row metrics for collector diagnostics.
  enable_query_metrics: true
  # If scrape_timeout <= 0, no timeout is set unless Prometheus provides one. The default is 10s.
  scrape_timeout: 55s
  # Subtracted from Prometheus' scrape_timeout to give us some headroom and prevent Prometheus from timing out first.
  scrape_timeout_offset: 500ms
  # Minimum interval between collector runs: by default (0s) collectors are executed on every scrape.
  min_interval: 0s
  # Maximum number of open connections to any one target. Metric queries will run concurrently on multiple connections,
  # as will concurrent scrapes.
  max_connections: 3
  # Maximum number of idle connections to any one target. Unless you use very long collection intervals, this should
  # always be the same as max_connections.
  max_idle_connections: 3
  # Maximum number of maximum amount of time a connection may be reused. Expired connections may be closed lazily before reuse.
  # If 0, connections are not closed due to a connection's age.
  max_connection_lifetime: 5m
  # Interval between database pings. By default (0s) ping every time when call target.ping().
  ping_interval: 30s

# The target to monitor and the collectors to execute on it.
target:
  # Stable target label used by exporter health and scrape metrics.
  # name: sql-instance-01
  # Data source name always has a URI schema that matches the driver name. In some cases (e.g. MySQL)
  # the schema gets dropped or replaced to match the driver expected DSN format.
  # data_source_name: 'sqlserver://prom_user:prom_password@dbserver1.example.com:1433/dbname'
  # data_source_name: 'sqlserver://127.0.0.1:1433?trusted+connection=yes&app+name=sql_exporter'
  # SQL Server alias: sql-instance-01. Use its reachable TCP endpoint because the
  # short host name is not resolvable from the exporter host/session.
  # Windows Authentication uses the account running the sql_exporter service.
  # Encryption is mandatory and the server certificate is trusted, matching SSMS.
  data_source_name: 'sqlserver://dbserver1.example.local:1433?trusted+connection=yes&encrypt=true&TrustServerCertificate=true&app+name=sql_exporter'

  # Collectors (referenced by name) to execute on the target.
  # Glob patterns are supported (see <https://pkg.go.dev/path/filepath#Match> for syntax).
  #
  # Profiles (pick one). Ready-to-copy collector lists are available in profiles/*.yml.
  # Files are always loaded via collector_files; this list controls what runs.
  # Removed package collectors (mssql_dwh / mssql_oltp / mssql_ssis / mssql_performance_counters /
  # mssql_workspace_memory / mssql_availability_sync) were merged into the collectors below.
  #
  # --- DWH / BI host (example dwh-host) ---
  # collectors:
  #   - mssql_standard
  #   - mssql_backup
  #   - mssql_restore
  #   - mssql_job_inventory
  #   - mssql_alwayson
  #   - mssql_alwayson_events
  #   - mssql_heavy_queries
  #   - mssql_plan_cache_hotspots
  #   - mssql_waits
  #   - mssql_memory
  #   - mssql_tempdb
  #   - mssql_file_io
  #   - mssql_blocking
  #   - mssql_log_usage
  #   - mssql_connections_detail
  #   - mssql_database_size_growth
  #   - mssql_cpu
  #   - mssql_buffer_pool
  #   - mssql_parallelism
  #   - mssql_job_running
  #   - mssql_job_failed
  #   - mssql_job_history
  #   - mssql_database_space
  #   - mssql_database_integrity
  #   - mssql_scheduler
  #   - mssql_plan_cache
  #   - mssql_columnstore
  #   - mssql_autogrowth
  #   - mssql_stats
  #   - mssql_index_usage
  #   - mssql_missing_index
  #   - mssql_ssis
  #
  # --- Restore / backup-sync secondary (example sql-host-02\NODE) ---
  # Prefer a lean profile; mssql_restore is the key collector (restorehistory lag).
  # collectors:
  #   - mssql_standard
  #   - mssql_restore
  #   - mssql_backup
  #   - mssql_job_inventory
  #   - mssql_job_running
  #   - mssql_job_failed
  #   - mssql_job_history
  #   - mssql_database_space
  #   - mssql_file_io
  #   - mssql_waits
  #   - mssql_memory
  #   - mssql_cpu
  #   - mssql_connections_detail
  #
  # --- OLTP host (example oltp-host) ---
  # collectors:
  #   - mssql_standard
  #   - mssql_backup
  #   - mssql_job_inventory
  #   - mssql_alwayson
  #   - mssql_alwayson_events
  #   - mssql_heavy_queries
  #   - mssql_plan_cache_hotspots
  #   - mssql_waits
  #   - mssql_memory
  #   - mssql_tempdb
  #   - mssql_file_io
  #   - mssql_blocking
  #   - mssql_log_usage
  #   - mssql_connections_detail
  #   - mssql_cpu
  #   - mssql_locks
  #   - mssql_transactions_long
  #   - mssql_buffer_pool
  #   - mssql_job_running
  #   - mssql_job_failed
  #   - mssql_job_history
  #   - mssql_database_space
  #   - mssql_database_integrity
  #   - mssql_scheduler
  #   - mssql_plan_cache
  #   - mssql_autogrowth
  #   - mssql_stats
  #   - mssql_index_usage
  #
  # --- SSIS catalog host (dedicated Integration Services) ---
  # collectors:
  #   - mssql_standard
  #   - mssql_backup
  #   - mssql_job_inventory
  #   - mssql_waits
  #   - mssql_memory
  #   - mssql_tempdb
  #   - mssql_file_io
  #   - mssql_blocking
  #   - mssql_log_usage
  #   - mssql_connections_detail
  #   - mssql_cpu
  #   - mssql_job_running
  #   - mssql_job_failed
  #   - mssql_job_history
  #   - mssql_database_space
  #   - mssql_database_integrity
  #   - mssql_autogrowth
  #   - mssql_ssis
  #
  # Default: all mssql_* collectors present in collector/.
  collectors: [mssql_*]

# Collector files specifies a list of globs. One collector definition is read from each matching file.
# Glob patterns are supported (see <https://pkg.go.dev/path/filepath#Match> for syntax).
# Paths are relative to the sql_exporter.yml directory (or the process working directory).
collector_files: 
  - "collector/*.collector.yml"
