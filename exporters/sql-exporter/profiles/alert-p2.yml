# Exporter collector profile — Alert P0 + P1 + P2
# Superset of alert-p1.yml for prometheus/profiles/p2-medium.yml / oltp.yml
# Role packs (replication/ssis/security/cdc) still need their collectors from role profiles.
#
# Deploy:
#   .\scripts\powershell\Deploy-SqlExporterConfig.ps1 -Computers SQL01 -Profile alert-p2.yml
collectors:
  # P0
  - mssql_standard
  - mssql_backup
  - mssql_database_integrity
  - mssql_job_failed
  - mssql_alwayson
  - mssql_hadr_cluster
  - mssql_restore
  # P1
  - mssql_cpu
  - mssql_file_io
  - mssql_log_usage
  - mssql_blocking
  - mssql_memory
  - mssql_tempdb
  - mssql_buffer_pool
  - mssql_scheduler
  - mssql_locks
  - mssql_heavy_queries
  - mssql_database_space
  - mssql_job_history
  - mssql_job_inventory
  - mssql_errorlog_signals
  # P2
  - mssql_connections_detail
  - mssql_parallelism
  - mssql_plan_cache
  - mssql_resource_governor
  - mssql_transactions_long
  - mssql_waits
  - mssql_autogrowth
  - mssql_columnstore
  - mssql_index_fragmentation
  - mssql_index_usage
  - mssql_missing_index
  - mssql_stats
  - mssql_query_store
  - mssql_job_running
  - mssql_database_configuration
  - mssql_database_size_growth
