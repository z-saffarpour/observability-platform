# Exporter collector profile — Alert P0 (Critical)
# Minimum collectors for prometheus/profiles/p0-critical.yml
#
# Deploy:
#   .\scripts\powershell\Deploy-SqlExporterConfig.ps1 -Computers SQL01 -Profile alert-p0.yml
#
# On standalone (non-AG/FCI) servers, HADR series may be absent; those alerts do not fire.
# mssql_restore is included so SqlRestoreSecondaryBehindRpo can evaluate on restore secondaries;
# on primary-only hosts the metric may be absent (alert simply does not fire).
collectors:
  - mssql_standard
  - mssql_backup
  - mssql_database_integrity
  - mssql_job_failed
  - mssql_alwayson
  - mssql_hadr_cluster
  - mssql_restore
