# Dedicated SSIS catalog host profile. Includes the core baseline.
collectors:
  # availability
  # mssql_restore stays on restore-secondary.yml / dwh-restore.yml.
  # On a primary, old restorehistory makes SqlRestoreSecondaryBehindRpo fire.
  - mssql_standard
  - mssql_backup
  - mssql_database_integrity
  # jobs
  - mssql_job_failed
  - mssql_job_history
  - mssql_job_inventory
  - mssql_job_running
  # space (filegroup runway, log usage, log/data growth)
  - mssql_database_space
  - mssql_log_usage
  - mssql_database_size_growth
  - mssql_autogrowth
  # performance
  - mssql_cpu
  - mssql_file_io
  - mssql_blocking
  - mssql_memory
  - mssql_tempdb
  - mssql_buffer_pool
  - mssql_scheduler
  - mssql_transactions_long
  - mssql_waits
  # config
  - mssql_database_configuration
  - mssql_instance_configuration
  - mssql_database_inventory
  - mssql_schema_ddl
  - mssql_security_ddl
  - mssql_server_ddl
  # signals / security
  - mssql_errorlog_signals
  - mssql_security
  # role
  - mssql_ssis
