# Exporter collector profile — Alert P0 + P1
# Superset of alert-p0.yml for prometheus/profiles/p1-high.yml
#
# Deploy:
#   .\scripts\powershell\Deploy-SqlExporterConfig.ps1 -Computers SQL01 -Profile alert-p1.yml
collectors:
  # P0
  - mssql_standard
  - mssql_backup
  - mssql_database_integrity
  - mssql_job_failed
  - mssql_alwayson
  - mssql_hadr_cluster
  - mssql_restore
  # P1
  - mssql_cpu
  - mssql_file_io
  - mssql_log_usage
  - mssql_blocking
  - mssql_memory
  - mssql_tempdb
  - mssql_buffer_pool
  - mssql_scheduler
  - mssql_locks
  - mssql_heavy_queries
  - mssql_plan_cache_hotspots
  - mssql_database_space
  - mssql_job_history
  - mssql_job_inventory
  - mssql_errorlog_signals
