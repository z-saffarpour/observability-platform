# Security and audit profile. Intentionally excludes high-cardinality
# performance-detail collectors (locks, heavy_queries, file_io, waits).
# Includes audit trail, space, autogrowth, errorlog, security, and certificates.
collectors:
  - mssql_standard
  - mssql_database_configuration
  - mssql_instance_configuration
  - mssql_backup
  - mssql_job_inventory
  - mssql_job_running
  - mssql_job_failed
  - mssql_job_history
  - mssql_database_space
  - mssql_database_integrity
  - mssql_autogrowth
  - mssql_database_inventory
  - mssql_schema_ddl
  - mssql_security_ddl
  - mssql_server_ddl
  - mssql_security
  - mssql_errorlog_signals
  - mssql_certificates
