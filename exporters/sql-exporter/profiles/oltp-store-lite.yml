# Lean OLTP profile for resource-constrained store SQL Server instances.
# Tuned for minimal lock/contention while keeping DBA tuning and integrity signals.
#
# Covered alert categories:
#   availability: instance/database state, backup age, CHECKDB/suspect pages
#   jobs: current failure, recent history, last outcome, long-running
#   space: file usage, filegroup runway, log usage, log growth (P0/P1), data growth
#   performance (P1): CPU, file I/O, blocking, memory grants, tempdb, PLE, scheduler, long requests
#   performance (P2 subset): session count, long transactions, wait pressure
#   maintenance (subset): autogrowth, stale stats
#   signals: ERRORLOG
#   security: mssql_security (site file required; see below)
#   config inventory: database list and DDL counts, without configuration-drift alerts
#
# Intentionally not collected, so these alerts stay silent on a store:
#   hadr: mssql_alwayson, mssql_hadr_cluster (add them if the store is in an AG/FCI)
#   availability restore: mssql_restore (restore secondaries use restore-secondary.yml)
#   SqlLockWaitPersistent: mssql_locks
#   SqlPlanCacheSingleUseRatioHigh: mssql_plan_cache (hotspots stay on; cache-size stays off)
#   SqlParallelismQueueHigh: mssql_parallelism
#   SqlResourceGovernorPressure: mssql_resource_governor
#   SqlQueryStoreDisabled: mssql_query_store
#   SqlDatabaseConfigurationUnsafe: mssql_database_configuration / mssql_instance_configuration
#   index/columnstore maintenance: mssql_index_usage, mssql_index_fragmentation,
#   mssql_missing_index, mssql_columnstore
#
# mssql_security is gitignored. Copy collector/mssql_security.collector.yml.example
# to mssql_security.collector.yml and edit the allow-list before deploy.
# Without that file, config check fails on this collector name.
#
# Recommended Prometheus scrape_interval: 90s–120s (scrape_timeout: 60s).
# Optional sql_exporter.yml tuning on very weak hosts:
#   global.min_interval: 90s
#   global.max_connections: 3
#
# Deploy:
#   .\scripts\powershell\sql-exporter\Install-SqlExporterRemote.ps1 -Computers STORE-SQL01 -Profile oltp-store-lite.yml
#   .\scripts\powershell\sql-exporter\Deploy-SqlExporterConfig.ps1 -Computers STORE-SQL01 -Profile oltp-store-lite.yml
collectors:
  # availability
  - mssql_standard
  - mssql_backup
  - mssql_database_integrity
  # jobs
  - mssql_job_failed
  - mssql_job_history
  - mssql_job_inventory
  - mssql_job_running
  # space
  - mssql_database_space
  - mssql_log_usage
  - mssql_database_size_growth
  - mssql_autogrowth
  # performance
  - mssql_cpu
  - mssql_file_io
  - mssql_blocking
  - mssql_memory
  - mssql_tempdb
  - mssql_buffer_pool
  - mssql_scheduler
  - mssql_heavy_queries
  - mssql_plan_cache_hotspots
  - mssql_connections_detail
  - mssql_transactions_long
  - mssql_waits
  # maintenance
  - mssql_stats
  # config inventory (not configuration-drift alerts)
  - mssql_database_inventory
  - mssql_schema_ddl
  - mssql_security_ddl
  - mssql_server_ddl
  # signals / security
  - mssql_errorlog_signals
  - mssql_security
