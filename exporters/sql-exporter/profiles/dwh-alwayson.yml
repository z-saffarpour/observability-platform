# Large DWH / BI profile for hosts that are also an Always On replica or a
# WSFC / FCI node. oltp-alwayson.yml and oltp-cluster.yml do not collect
# columnstore, parallelism detail, or SSIS.
collectors:
  # availability
  # Restore-sync warehouses use dwh-restore.yml (adds mssql_restore).
  - mssql_standard
  - mssql_backup
  - mssql_database_integrity
  # hadr — AG replica, listener, WSFC quorum, FCI node
  - mssql_alwayson
  - mssql_alwayson_events
  - mssql_hadr_cluster
  # jobs
  - mssql_job_failed
  - mssql_job_history
  - mssql_job_inventory
  - mssql_job_running
  # space (filegroup runway, log usage, log/data growth)
  - mssql_database_space
  - mssql_log_usage
  - mssql_database_size_growth
  - mssql_autogrowth
  # performance
  - mssql_cpu
  - mssql_file_io
  - mssql_blocking
  - mssql_memory
  - mssql_tempdb
  - mssql_buffer_pool
  - mssql_scheduler
  - mssql_locks
  - mssql_heavy_queries
  - mssql_plan_cache_hotspots
  - mssql_parallelism
  - mssql_plan_cache
  - mssql_resource_governor
  - mssql_transactions_long
  - mssql_waits
  # maintenance
  - mssql_columnstore
  - mssql_index_usage
  - mssql_missing_index
  - mssql_stats
  - mssql_query_store
  # config
  - mssql_database_configuration
  - mssql_instance_configuration
  - mssql_database_inventory
  - mssql_schema_ddl
  - mssql_security_ddl
  - mssql_server_ddl
  # signals / security
  - mssql_errorlog_signals
  - mssql_security
