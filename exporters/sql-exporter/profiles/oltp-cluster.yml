# OLTP instance on a Windows failover cluster / FCI or WSFC quorum.
# Same non-role alert coverage as oltp.yml, including mssql_hadr_cluster.
# Inventory signature: mssql_hadr_cluster_quorum_state.
collectors:
  # availability
  - mssql_standard
  - mssql_backup
  - mssql_database_integrity
  # hadr
  - mssql_alwayson
  - mssql_alwayson_events
  - mssql_hadr_cluster
  # jobs
  - mssql_job_failed
  - mssql_job_history
  - mssql_job_inventory
  - mssql_job_running
  # space (filegroup runway, log usage, log/data growth)
  - mssql_database_space
  - mssql_log_usage
  - mssql_database_size_growth
  - mssql_autogrowth
  # performance
  - mssql_cpu
  - mssql_file_io
  - mssql_blocking
  - mssql_memory
  - mssql_tempdb
  - mssql_buffer_pool
  - mssql_scheduler
  - mssql_locks
  - mssql_heavy_queries
  - mssql_plan_cache_hotspots
  - mssql_connections_detail
  - mssql_parallelism
  - mssql_plan_cache
  - mssql_resource_governor
  - mssql_transactions_long
  - mssql_waits
  # maintenance
  - mssql_columnstore
  - mssql_stats
  - mssql_query_store
  # config
  - mssql_database_configuration
  - mssql_instance_configuration
  - mssql_database_inventory
  - mssql_schema_ddl
  - mssql_security_ddl
  - mssql_server_ddl
  # signals / security
  - mssql_errorlog_signals
  - mssql_security
