# SSMS Disk Usage–style breakdown per user database.
# Matches SSMS report: data file reserved, log reserved, and pie shares
# data / index / unused / unallocated (+ log used/unused %).
#
#   GRANT VIEW SERVER STATE TO
#   GRANT VIEW ANY DEFINITION TO
#   Databases must be ONLINE with HAS_DBACCESS.
#
# Heavy on large DBs (allocation_units scan) — keep min_interval high.
collector_name: mssql_database_disk_usage

min_interval: 300s

metrics:
  - metric_name: mssql_database_disk_total_reserved_mb
    type: gauge
    help: 'Total reserved size (data files + log files) in MB — SSMS Disk Usage Total Space Reserved.'
    key_labels:
      - db
    values: [total_reserved_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_data_reserved_mb
    type: gauge
    help: 'Data files size (MB) — SSMS Disk Usage Data Files Space Reserved.'
    key_labels:
      - db
    values: [data_reserved_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_log_reserved_mb
    type: gauge
    help: 'Log files size (MB) — SSMS Disk Usage Transaction Log Space Reserved.'
    key_labels:
      - db
    values: [log_reserved_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_reserved_mb
    type: gauge
    help: 'Pages reserved by objects inside data files (MB).'
    key_labels:
      - db
    values: [reserved_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_data_mb
    type: gauge
    help: 'Data pages used (MB) — SSMS pie segment data.'
    key_labels:
      - db
    values: [data_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_index_mb
    type: gauge
    help: 'Index pages used (MB) — SSMS pie segment index.'
    key_labels:
      - db
    values: [index_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_unused_mb
    type: gauge
    help: 'Reserved but unused pages (MB) — SSMS pie segment unused.'
    key_labels:
      - db
    values: [unused_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_unallocated_mb
    type: gauge
    help: 'Unallocated space in data files (MB) — SSMS pie segment unallocated.'
    key_labels:
      - db
    values: [unallocated_mb]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_pct_data
    type: gauge
    help: 'Percent of data-file space used by data pages (SSMS pie).'
    key_labels:
      - db
    values: [pct_data]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_pct_index
    type: gauge
    help: 'Percent of data-file space used by indexes (SSMS pie).'
    key_labels:
      - db
    values: [pct_index]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_pct_unused
    type: gauge
    help: 'Percent of data-file space reserved but unused (SSMS pie).'
    key_labels:
      - db
    values: [pct_unused]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_pct_unallocated
    type: gauge
    help: 'Percent of data-file space unallocated (SSMS pie).'
    key_labels:
      - db
    values: [pct_unallocated]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_log_used_pct
    type: gauge
    help: 'Transaction log used percent (SSMS Log pie Used).'
    key_labels:
      - db
    values: [log_used_pct]
    query_ref: mssql_database_disk_usage

  - metric_name: mssql_database_disk_log_unused_pct
    type: gauge
    help: 'Transaction log unused percent (SSMS Log pie Unused).'
    key_labels:
      - db
    values: [log_unused_pct]
    query_ref: mssql_database_disk_usage

queries:
  - query_name: mssql_database_disk_usage
    query: |
      SET NOCOUNT ON;
      IF OBJECT_ID(N'tempdb..#mssql_db_disk_usage') IS NOT NULL DROP TABLE #mssql_db_disk_usage;
      CREATE TABLE #mssql_db_disk_usage (
          db sysname NOT NULL,
          data_reserved_mb float NULL,
          log_reserved_mb float NULL,
          total_reserved_mb float NULL,
          reserved_mb float NULL,
          data_mb float NULL,
          index_mb float NULL,
          unused_mb float NULL,
          unallocated_mb float NULL,
          pct_data float NULL,
          pct_index float NULL,
          pct_unused float NULL,
          pct_unallocated float NULL,
          log_used_pct float NULL,
          log_unused_pct float NULL
      );

      DECLARE @db sysname, @sql nvarchar(max);
      DECLARE c CURSOR LOCAL FAST_FORWARD FOR
          SELECT d.name
          FROM sys.databases AS d WITH (NOLOCK)
          WHERE d.state = 0
            AND d.database_id > 4
            AND d.source_database_id IS NULL
            AND HAS_DBACCESS(d.name) = 1
            AND DATABASEPROPERTYEX(d.name, 'Updateability') = N'READ_WRITE'
            AND d.name NOT IN (N'DWConfiguration', N'DWDiagnostics', N'DWQueue');

      OPEN c;
      FETCH NEXT FROM c INTO @db;
      WHILE @@FETCH_STATUS = 0
      BEGIN
          SET @sql = N'USE ' + QUOTENAME(@db) + N';
            DECLARE @data_file_mb float = (
              SELECT CAST(SUM(CONVERT(bigint, size)) AS float) * 8.0 / 1024.0
              FROM sys.database_files WITH (NOLOCK) WHERE type = 0
            );
            DECLARE @log_file_mb float = (
              SELECT CAST(SUM(CONVERT(bigint, size)) AS float) * 8.0 / 1024.0
              FROM sys.database_files WITH (NOLOCK) WHERE type = 1
            );
            DECLARE @reserved_mb float, @used_mb float, @data_mb float, @index_mb float, @unused_mb float;
            SELECT
              @reserved_mb = CAST(SUM(CONVERT(bigint, a.total_pages)) AS float) * 8.0 / 1024.0,
              @used_mb = CAST(SUM(CONVERT(bigint, a.used_pages)) AS float) * 8.0 / 1024.0,
              @data_mb = CAST(SUM(CONVERT(bigint,
                CASE
                  WHEN it.internal_type IN (202,204,207,211,212,213,214,215,216,221,222,236) THEN 0
                  WHEN a.type <> 1 AND p.index_id < 2 THEN a.used_pages
                  WHEN p.index_id < 2 THEN a.data_pages
                  ELSE 0
                END
              )) AS float) * 8.0 / 1024.0
            FROM sys.partitions AS p WITH (NOLOCK)
            JOIN sys.allocation_units AS a WITH (NOLOCK) ON p.partition_id = a.container_id
            LEFT JOIN sys.internal_tables AS it WITH (NOLOCK) ON p.object_id = it.object_id;
            SET @index_mb = CASE WHEN @used_mb IS NULL OR @data_mb IS NULL THEN 0 ELSE @used_mb - @data_mb END;
            IF @index_mb < 0 SET @index_mb = 0;
            SET @unused_mb = CASE WHEN @reserved_mb IS NULL OR @used_mb IS NULL THEN 0 ELSE @reserved_mb - @used_mb END;
            IF @unused_mb < 0 SET @unused_mb = 0;
            DECLARE @unalloc_mb float = CASE
              WHEN @data_file_mb IS NULL OR @reserved_mb IS NULL THEN 0
              WHEN @data_file_mb > @reserved_mb THEN @data_file_mb - @reserved_mb
              ELSE 0
            END;
            DECLARE @log_used_pct float = NULL;
            SELECT @log_used_pct = used_log_space_in_percent FROM sys.dm_db_log_space_usage;
            IF @log_used_pct IS NULL SET @log_used_pct = 0;
            INSERT INTO #mssql_db_disk_usage (
              db, data_reserved_mb, log_reserved_mb, total_reserved_mb,
              reserved_mb, data_mb, index_mb, unused_mb, unallocated_mb,
              pct_data, pct_index, pct_unused, pct_unallocated,
              log_used_pct, log_unused_pct
            )
            VALUES (
              DB_NAME(),
              @data_file_mb,
              @log_file_mb,
              ISNULL(@data_file_mb,0) + ISNULL(@log_file_mb,0),
              @reserved_mb,
              @data_mb,
              @index_mb,
              @unused_mb,
              @unalloc_mb,
              CASE WHEN ISNULL(@data_file_mb,0) <= 0 THEN 0 ELSE ROUND(100.0 * ISNULL(@data_mb,0) / @data_file_mb, 2) END,
              CASE WHEN ISNULL(@data_file_mb,0) <= 0 THEN 0 ELSE ROUND(100.0 * ISNULL(@index_mb,0) / @data_file_mb, 2) END,
              CASE WHEN ISNULL(@data_file_mb,0) <= 0 THEN 0 ELSE ROUND(100.0 * ISNULL(@unused_mb,0) / @data_file_mb, 2) END,
              CASE WHEN ISNULL(@data_file_mb,0) <= 0 THEN 0 ELSE ROUND(100.0 * ISNULL(@unalloc_mb,0) / @data_file_mb, 2) END,
              ROUND(@log_used_pct, 2),
              ROUND(CASE WHEN 100.0 - @log_used_pct < 0 THEN 0 ELSE 100.0 - @log_used_pct END, 2)
            );';
          BEGIN TRY
              EXEC (@sql);
          END TRY
          BEGIN CATCH
          END CATCH;
          FETCH NEXT FROM c INTO @db;
      END
      CLOSE c;
      DEALLOCATE c;

      SELECT
          db,
          data_reserved_mb,
          log_reserved_mb,
          total_reserved_mb,
          reserved_mb,
          data_mb,
          index_mb,
          unused_mb,
          unallocated_mb,
          pct_data,
          pct_index,
          pct_unused,
          pct_unallocated,
          log_used_pct,
          log_unused_pct
      FROM #mssql_db_disk_usage;
