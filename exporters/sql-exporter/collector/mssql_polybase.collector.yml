  - query_name: mssql_polybase_external_format_list
    query: |
      SET NOCOUNT ON;
      IF OBJECT_ID(N'tempdb..#mssql_pb_formats') IS NOT NULL DROP TABLE #mssql_pb_formats;
      CREATE TABLE #mssql_pb_formats (
          db sysname NOT NULL,
          format_name sysname NOT NULL,
          format_type nvarchar(32) NOT NULL,
          info float NOT NULL
      );

      DECLARE @db sysname, @sql nvarchar(max);
      DECLARE c CURSOR LOCAL FAST_FORWARD FOR
          SELECT name
          FROM sys.databases WITH (NOLOCK)
          WHERE state = 0
            AND source_database_id IS NULL
            AND name NOT IN (N'tempdb', N'model')
            AND HAS_DBACCESS(name) = 1;

      OPEN c;
      FETCH NEXT FROM c INTO @db;
      WHILE @@FETCH_STATUS = 0
      BEGIN
          SET @sql = N'USE ' + QUOTENAME(@db) + N';
            IF OBJECT_ID(N''sys.external_file_formats'', N''V'') IS NOT NULL
            INSERT INTO #mssql_pb_formats (db, format_name, format_type, info)
            SELECT
                DB_NAME(),
                ff.name,
                CASE ff.format_type
                    WHEN 1 THEN N''DELIMITEDTEXT''
                    WHEN 2 THEN N''RCFILE''
                    WHEN 3 THEN N''ORC''
                    WHEN 4 THEN N''PARQUET''
                    ELSE CONCAT(N''type_'', CONVERT(varchar(10), ff.format_type))
                END,
                CAST(1 AS float)
            FROM sys.external_file_formats AS ff WITH (NOLOCK);';
          BEGIN TRY
              EXEC (@sql);
          END TRY
          BEGIN CATCH
          END CATCH;
          FETCH NEXT FROM c INTO @db;
      END
      CLOSE c;
      DEALLOCATE c;

      SELECT db, format_name, format_type, info
      FROM #mssql_pb_formats;
