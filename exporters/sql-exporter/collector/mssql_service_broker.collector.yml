  - query_name: mssql_service_broker_certificates
    query: |
      CREATE TABLE #broker_cert (db sysname, certificate nvarchar(128), expiry_days float);

      BEGIN TRY
        INSERT #broker_cert (db, certificate, expiry_days)
        SELECT N'_endpoint',
               COALESCE(c.name, N'(none)'),
               CAST(CASE WHEN c.expiry_date IS NULL THEN -1
                         ELSE DATEDIFF(DAY, GETDATE(), c.expiry_date) END AS float)
        FROM sys.service_broker_endpoints e WITH (NOLOCK)
        LEFT JOIN master.sys.certificates c WITH (NOLOCK) ON c.certificate_id = e.certificate_id
        WHERE e.certificate_id IS NOT NULL;
      END TRY
      BEGIN CATCH
      END CATCH;

      DECLARE @db sysname, @sql nvarchar(max);
      DECLARE dbs CURSOR LOCAL FAST_FORWARD FOR
        SELECT name FROM sys.databases WITH (NOLOCK)
        WHERE database_id > 4 AND state = 0 AND is_broker_enabled = 1
          AND source_database_id IS NULL AND HAS_DBACCESS(name) = 1;
      OPEN dbs; FETCH NEXT FROM dbs INTO @db;
      WHILE @@FETCH_STATUS = 0
      BEGIN
        SET @sql = N'USE ' + QUOTENAME(@db) + N';
          INSERT #broker_cert
          SELECT @name, c.name,
                 CAST(CASE WHEN c.expiry_date IS NULL THEN -1
                           ELSE DATEDIFF(DAY, GETDATE(), c.expiry_date) END AS float)
          FROM sys.certificates c
          WHERE c.pvt_key_encryption_type <> N''NA'';';
        BEGIN TRY EXEC sys.sp_executesql @sql, N'@name sysname', @name=@db; END TRY BEGIN CATCH END CATCH;
        FETCH NEXT FROM dbs INTO @db;
      END
      CLOSE dbs; DEALLOCATE dbs;
      SELECT db, certificate, expiry_days FROM #broker_cert;
