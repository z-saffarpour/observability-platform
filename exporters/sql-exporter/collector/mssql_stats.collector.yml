# Stale / heavily modified statistics (bounded TOP N across online user databases).
#
# Age uses STATS_DATE. dm_db_stats_properties runs only for a capped candidate set
# per database (oldest statistics plus statistics on the largest tables).
#
# It is required that the SQL Server user has the following permissions:
#
#   GRANT VIEW SERVER STATE TO
#   Access to user databases required
#
# Auto-loaded via collectors: [mssql_*] and collector_files: ["collector/*.collector.yml"]
#
collector_name: mssql_stats

# STATS_DATE still walks each user database; 10m is enough for DBA review.
min_interval: 600s

metrics:
  - metric_name: mssql_stats_age_seconds
    type: gauge
    help: 'Age in seconds for a bounded set of stale or heavily modified statistics.'
    key_labels:
      - db
      - schema_name
      - table_name
      - stats_name
    values: [age_seconds]
    query_ref: mssql_stats_stale

  - metric_name: mssql_stats_modification_counter
    type: gauge
    help: 'modification_counter for TOP stale/changed statistics.'
    key_labels:
      - db
      - schema_name
      - table_name
      - stats_name
    values: [modification_counter]
    query_ref: mssql_stats_stale

  - metric_name: mssql_stats_rows
    type: gauge
    help: 'Row count snapshot for TOP stale/changed statistics.'
    key_labels:
      - db
      - schema_name
      - table_name
      - stats_name
    values: [rows]
    query_ref: mssql_stats_stale

  - metric_name: mssql_stats_rows_sampled
    type: gauge
    help: 'rows_sampled for TOP stale/changed statistics.'
    key_labels:
      - db
      - schema_name
      - table_name
      - stats_name
    values: [rows_sampled]
    query_ref: mssql_stats_stale

  - metric_name: mssql_stats_sample_percent
    type: gauge
    help: 'Sample percent (rows_sampled/rows*100) for TOP stale/changed statistics.'
    key_labels:
      - db
      - schema_name
      - table_name
      - stats_name
    values: [sample_percent]
    query_ref: mssql_stats_stale

  - metric_name: mssql_stats_stale_count
    type: gauge
    help: 'Count of user statistics per database whose STATS_DATE is missing or older than 7 days.'
    key_labels:
      - db
    values: [stale_count]
    query_ref: mssql_stats_stale_count

queries:
  - query_name: mssql_stats_stale
    query: |
      SET NOCOUNT ON;
      IF OBJECT_ID(N'tempdb..#mssql_stats') IS NOT NULL DROP TABLE #mssql_stats;
      CREATE TABLE #mssql_stats (
          db sysname NOT NULL,
          schema_name sysname NOT NULL,
          table_name sysname NOT NULL,
          stats_name sysname NOT NULL,
          age_seconds float NULL,
          modification_counter float NULL,
          rows float NULL,
          rows_sampled float NULL,
          sample_percent float NULL
      );

      DECLARE @db sysname, @sql nvarchar(max);
      DECLARE c CURSOR LOCAL FAST_FORWARD FOR
          SELECT name
          FROM sys.databases WITH (NOLOCK)
          WHERE state = 0
            AND source_database_id IS NULL
            AND name NOT IN (N'tempdb', N'model', N'msdb')
            AND HAS_DBACCESS(name) = 1;

      OPEN c;
      FETCH NEXT FROM c INTO @db;
      WHILE @@FETCH_STATUS = 0
      BEGIN
          SET @sql = N'USE ' + QUOTENAME(@db) + N';
            ;WITH oldest AS (
                SELECT TOP (20)
                    s.object_id,
                    s.stats_id
                FROM sys.stats AS s
                INNER JOIN sys.objects AS o
                    ON o.object_id = s.object_id
                CROSS APPLY (
                    SELECT STATS_DATE(s.object_id, s.stats_id) AS last_updated
                ) AS d
                WHERE o.is_ms_shipped = 0
                  AND o.type IN (N''U'', N''V'')
                ORDER BY
                    CASE WHEN d.last_updated IS NULL THEN 0 ELSE 1 END,
                    d.last_updated ASC
            ),
            largest_objects AS (
                SELECT TOP (8)
                    p.object_id
                FROM sys.partitions AS p
                INNER JOIN sys.objects AS o
                    ON o.object_id = p.object_id
                WHERE o.is_ms_shipped = 0
                  AND o.type = N''U''
                  AND p.index_id IN (0, 1)
                GROUP BY p.object_id
                ORDER BY SUM(p.rows) DESC
            ),
            largest_stats AS (
                SELECT TOP (20)
                    s.object_id,
                    s.stats_id
                FROM sys.stats AS s
                INNER JOIN largest_objects AS l
                    ON l.object_id = s.object_id
                ORDER BY s.stats_id
            ),
            candidates AS (
                SELECT object_id, stats_id FROM oldest
                UNION
                SELECT object_id, stats_id FROM largest_stats
            )
            INSERT INTO #mssql_stats (db, schema_name, table_name, stats_name, age_seconds, modification_counter, rows, rows_sampled, sample_percent)
            SELECT TOP (40)
                DB_NAME(),
                ISNULL(OBJECT_SCHEMA_NAME(c.object_id), N''''),
                ISNULL(OBJECT_NAME(c.object_id), N''''),
                s.name,
                CASE
                    WHEN sp.last_updated IS NULL THEN 2147483647.0
                    WHEN sp.last_updated < DATEADD(YEAR, -50, GETDATE()) THEN 2147483647.0
                    ELSE CAST(DATEDIFF(SECOND, sp.last_updated, GETDATE()) AS float)
                END,
                CAST(ISNULL(sp.modification_counter, 0) AS float),
                CAST(ISNULL(sp.rows, 0) AS float),
                CAST(ISNULL(sp.rows_sampled, 0) AS float),
                CAST(
                    CASE
                        WHEN ISNULL(sp.rows, 0) <= 0 THEN 0
                        ELSE 100.0 * ISNULL(sp.rows_sampled, 0) / sp.rows
                    END AS float
                )
            FROM candidates AS c
            INNER JOIN sys.stats AS s
                ON s.object_id = c.object_id
               AND s.stats_id = c.stats_id
            CROSS APPLY sys.dm_db_stats_properties(c.object_id, c.stats_id) AS sp
            WHERE sp.modification_counter >= 1000
               OR sp.last_updated < DATEADD(DAY, -7, GETDATE())
               OR sp.last_updated IS NULL
            ORDER BY
                ISNULL(sp.modification_counter, 0) DESC,
                ISNULL(sp.last_updated, ''19000101'') ASC;';
          BEGIN TRY
              EXEC (@sql);
          END TRY
          BEGIN CATCH
          END CATCH;
          FETCH NEXT FROM c INTO @db;
      END
      CLOSE c;
      DEALLOCATE c;

      SELECT TOP (80)
          db,
          schema_name,
          table_name,
          stats_name,
          age_seconds,
          modification_counter,
          rows,
          rows_sampled,
          sample_percent
      FROM #mssql_stats
      ORDER BY modification_counter DESC, age_seconds DESC;

  - query_name: mssql_stats_stale_count
    query: |
      SET NOCOUNT ON;
      IF OBJECT_ID(N'tempdb..#mssql_stats_cnt') IS NOT NULL DROP TABLE #mssql_stats_cnt;
      CREATE TABLE #mssql_stats_cnt (
          db sysname NOT NULL,
          stale_count float NOT NULL
      );

      DECLARE @db sysname, @sql nvarchar(max);
      DECLARE c CURSOR LOCAL FAST_FORWARD FOR
          SELECT name
          FROM sys.databases WITH (NOLOCK)
          WHERE state = 0
            AND source_database_id IS NULL
            AND name NOT IN (N'tempdb', N'model', N'msdb')
            AND HAS_DBACCESS(name) = 1;

      OPEN c;
      FETCH NEXT FROM c INTO @db;
      WHILE @@FETCH_STATUS = 0
      BEGIN
          SET @sql = N'USE ' + QUOTENAME(@db) + N';
            INSERT INTO #mssql_stats_cnt (db, stale_count)
            SELECT
                DB_NAME(),
                CAST(COUNT_BIG(*) AS float)
            FROM sys.stats AS s
            INNER JOIN sys.objects AS o
                ON o.object_id = s.object_id
            CROSS APPLY (
                SELECT STATS_DATE(s.object_id, s.stats_id) AS last_updated
            ) AS d
            WHERE o.is_ms_shipped = 0
              AND o.type IN (N''U'', N''V'')
              AND (
                    d.last_updated IS NULL
                 OR d.last_updated < DATEADD(DAY, -7, GETDATE())
              );';
          BEGIN TRY
              EXEC (@sql);
          END TRY
          BEGIN CATCH
          END CATCH;
          FETCH NEXT FROM c INTO @db;
      END
      CLOSE c;
      DEALLOCATE c;

      SELECT db, stale_count
      FROM #mssql_stats_cnt
      WHERE stale_count > 0
      ORDER BY stale_count DESC;
