# Recent deadlock victim <-> other process pairs from system_health (xml_deadlock_report).
#
# Portal / refresh-data scrape mssql_deadlock_pair_info from Prometheus only (no direct SQL).
#
# Permissions: GRANT VIEW SERVER STATE TO
# Loaded via collector_files + explicit collectors list on HQ exporters.

collector_name: mssql_deadlock_details

min_interval: 60s

metrics:
  - metric_name: mssql_deadlock_pair_info
    type: gauge
    help: '1 for a recent xml_deadlock_report pair (victim vs other) from system_health.'
    key_labels:
      - event_time
      - victim_spid
      - victim_login
      - victim_host
      - victim_program
      - victim_db
      - victim_sql
      - other_spid
      - other_login
      - other_host
      - other_program
      - other_db
      - other_sql
      - process_count
    static_value: 1
    query_ref: mssql_deadlock_pairs

queries:
  - query_name: mssql_deadlock_pairs
    query: |
      SET QUOTED_IDENTIFIER ON;
      SET ANSI_NULLS ON;
      DECLARE @x XML;
      SELECT @x = CAST(target_data AS XML)
      FROM sys.dm_xe_session_targets st
      JOIN sys.dm_xe_sessions s ON s.address = st.event_session_address
      WHERE s.name = N'system_health' AND st.target_name = N'ring_buffer';

      IF @x IS NULL
      BEGIN
        SELECT
          CAST(NULL AS varchar(30)) AS event_time,
          CAST(NULL AS varchar(16)) AS victim_spid,
          CAST(NULL AS nvarchar(128)) AS victim_login,
          CAST(NULL AS nvarchar(128)) AS victim_host,
          CAST(NULL AS nvarchar(128)) AS victim_program,
          CAST(NULL AS nvarchar(128)) AS victim_db,
          CAST(NULL AS nvarchar(160)) AS victim_sql,
          CAST(NULL AS varchar(16)) AS other_spid,
          CAST(NULL AS nvarchar(128)) AS other_login,
          CAST(NULL AS nvarchar(128)) AS other_host,
          CAST(NULL AS nvarchar(128)) AS other_program,
          CAST(NULL AS nvarchar(128)) AS other_db,
          CAST(NULL AS nvarchar(160)) AS other_sql,
          CAST(NULL AS varchar(16)) AS process_count
        WHERE 1 = 0;
        RETURN;
      END;

      ;WITH ev AS (
        SELECT TOP (5)
          n.value('@timestamp', 'datetimeoffset') AS event_time,
          n.query('(data[@name="xml_report"]/value/deadlock)[1]') AS dl
        FROM @x.nodes('RingBufferTarget/event[@name="xml_deadlock_report"]') q(n)
        ORDER BY n.value('@timestamp', 'datetimeoffset') DESC
      ),
      procs AS (
        SELECT
          e.event_time,
          p.value('@spid', 'int') AS spid,
          p.value('@loginname', 'nvarchar(128)') AS login_name,
          p.value('@hostname', 'nvarchar(128)') AS host_name,
          p.value('@clientapp', 'nvarchar(256)') AS program_name,
          p.value('@currentdbname', 'nvarchar(128)') AS db_name,
          LEFT(REPLACE(REPLACE(ISNULL(p.value('(inputbuf/text())[1]', 'nvarchar(max)'), N''), CHAR(13), N' '), CHAR(10), N' '), 120) AS sql_text,
          CASE WHEN EXISTS (
            SELECT 1
            FROM e.dl.nodes('/deadlock/victim-list/victimProcess') vl(v2)
            WHERE v2.value('@id','nvarchar(128)') = p.value('@id','nvarchar(128)')
          ) THEN 1 ELSE 0 END AS is_victim
        FROM ev e
        CROSS APPLY e.dl.nodes('/deadlock/process-list/process') pl(p)
      )
      SELECT TOP 5
        CONVERT(varchar(19), SWITCHOFFSET(event_time, '+00:00'), 126) + 'Z' AS event_time,
        CAST(MAX(CASE WHEN is_victim = 1 THEN spid END) AS varchar(16)) AS victim_spid,
        ISNULL(MAX(CASE WHEN is_victim = 1 THEN login_name END), N'') AS victim_login,
        ISNULL(MAX(CASE WHEN is_victim = 1 THEN host_name END), N'') AS victim_host,
        ISNULL(MAX(CASE WHEN is_victim = 1 THEN LEFT(program_name, 64) END), N'') AS victim_program,
        ISNULL(MAX(CASE WHEN is_victim = 1 THEN db_name END), N'') AS victim_db,
        ISNULL(MAX(CASE WHEN is_victim = 1 THEN sql_text END), N'') AS victim_sql,
        CAST(MAX(CASE WHEN is_victim = 0 THEN spid END) AS varchar(16)) AS other_spid,
        ISNULL(MAX(CASE WHEN is_victim = 0 THEN login_name END), N'') AS other_login,
        ISNULL(MAX(CASE WHEN is_victim = 0 THEN host_name END), N'') AS other_host,
        ISNULL(MAX(CASE WHEN is_victim = 0 THEN LEFT(program_name, 64) END), N'') AS other_program,
        ISNULL(MAX(CASE WHEN is_victim = 0 THEN db_name END), N'') AS other_db,
        ISNULL(MAX(CASE WHEN is_victim = 0 THEN sql_text END), N'') AS other_sql,
        CAST(COUNT(*) AS varchar(16)) AS process_count
      FROM procs
      GROUP BY event_time
      ORDER BY event_time DESC;
