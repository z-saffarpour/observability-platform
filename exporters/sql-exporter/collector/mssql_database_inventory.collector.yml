# Current user-database inventory.
#
# Emits one mssql_database_info series per user database (database_id > 4)
# plus mssql_database_count. CREATE/ALTER/DROP events are collected by
# mssql_schema_ddl (Extended Events session observability_database_ddl).
#
# Permissions: VIEW ANY DATABASE (same as mssql_standard).

collector_name: mssql_database_inventory

min_interval: 60s

metrics:
  - metric_name: mssql_database_info
    type: gauge
    help: '1 if the user database currently exists on the instance (inventory for create/drop detection).'
    key_labels:
      - db
      - state_desc
      - create_date
    static_value: 1
    query: |
      SELECT
        name AS db,
        state_desc,
        CONVERT(varchar(19), create_date, 120) AS create_date
      FROM sys.databases
      WHERE database_id > 4

  - metric_name: mssql_database_count
    type: gauge
    help: 'Number of user databases on the instance (database_id > 4).'
    values: [cnt]
    query: |
      SELECT CAST(COUNT(*) AS float) AS cnt
      FROM sys.databases
      WHERE database_id > 4
