collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time,process,tcp,update"
collector:
  update:
    online: false
    scrape_interval: 6h
  service:
    include: "^(windows_exporter|AOS60\\$.+|W3SVC|WAS)$"
  process:
    include: "^(Ax32Serv|w3wp)$"
log:
  level: error
  format: json
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
