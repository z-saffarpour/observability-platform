collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time,process,tcp"
collector:
  service:
    include: "^(windows_exporter|PowerBIReportServer|PBIRS.*|SQLServerReportingServices|ReportServer.*)$"
  process:
    include: "^(ReportingServicesService|Microsoft\\.ReportingServices.*|RSPortal|MashupContainer|msmdsrv)$"
log:
  level: error
  format: logfmt
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
