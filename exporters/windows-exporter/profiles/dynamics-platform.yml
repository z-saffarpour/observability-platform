collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time,process,tcp"
collector:
  service:
    include: "^(windows_exporter|AOS60\\$.+|FabricHostSvc|FabricInstallerSvc|W3SVC|WAS)$"
  process:
    include: "^(Ax32Serv|Fabric.*|Microsoft\\.Dynamics\\.AX\\..*|w3wp)$"
log:
  level: error
  format: logfmt
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
