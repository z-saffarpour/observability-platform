collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time"
collector:
  service:
    include: "^(windows_exporter)$"
log:
  level: error
  format: logfmt
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
