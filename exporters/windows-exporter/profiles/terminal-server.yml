collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time,terminal_services,tcp"
collector:
  service:
    include: "^(windows_exporter|TermService|SessionEnv|UmRdpService|Tssdis|TScPubRPC|RDMS|TSGateway|TSWebAccess|RasMan)$"
log:
  level: error
  format: json
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
