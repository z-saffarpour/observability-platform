collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time,process,textfile,update"
collector:
  update:
    online: false
    scrape_interval: 6h
  textfile:
    directories:
      - "C:\\Program Files\\Observability\\PrometheusExporters\\windows-exporter\\textfile_inputs"
  service:
    include: "^(windows_exporter|MSSQLServerOLAPService|MSOLAP\\$.+|SSASTELEMETRY.*)$"
  process:
    include: "^(msmdsrv)$"
log:
  level: error
  format: json
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
