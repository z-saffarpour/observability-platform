collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time,mssql,process,tcp,mscluster,textfile"
collector:
  textfile:
    directories:
      - "C:\\Program Files\\DBA Monitoring\\Prometheus_Exporter\\windows-exporter\\textfile_inputs"
  mssql:
    enabled: [accessmethods, availreplica, bufman, databases, dbreplica, genstats, info, locks, memmgr, sqlerrors, sqlstats, transactions, waitstats]
  mscluster:
    enabled: [cluster, network, node, resource, resourcegroup]
  service:
    include: "^(windows_exporter|ClusSvc|MSSQLSERVER|SQLSERVERAGENT|MSSQL\\$.+|SQLAgent\\$.+|SQLTELEMETRY.*|SQLBrowser|SQLWriter|MSSQLServerOLAPService|MSOLAP\\$.+|SSASTELEMETRY.*|PowerBIReportServer|PBIRS.*|SQLServerReportingServices|ReportServer.*)$"
  process:
    include: "^(sqlservr|SQLAGENT|sqlbrowser|fdhost|fdlauncher|msmdsrv|ReportingServicesService|Microsoft\\.ReportingServices.*|RSPortal|MashupContainer)$"
log:
  level: error
  format: logfmt
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
