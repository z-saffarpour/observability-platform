collectors:
  enabled: "cpu,memory,pagefile,logical_disk,physical_disk,net,os,service,system,time,mssql,process,tcp"
collector:
  mssql:
    enabled: [accessmethods, availreplica, bufman, databases, dbreplica, genstats, info, locks, memmgr, sqlerrors, sqlstats, transactions, waitstats]
  service:
    include: "^(windows_exporter|MSSQLSERVER|SQLSERVERAGENT|MSSQL\\$.+|SQLAgent\\$.+|SQLTELEMETRY.*|SQLBrowser|SQLWriter)$"
  process:
    include: "^(sqlservr|SQLAGENT|sqlbrowser|fdhost|fdlauncher)$"
log:
  level: error
  format: json
  file: eventlog
scrape:
  timeout-margin: 0.5
telemetry:
  path: /metrics
web:
  listen-address: ":9182"
