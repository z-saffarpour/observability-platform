# Discovery is required before enabling this collector. Object names vary by
# SQL Server/SSAS/PBIRS version, language, and named instance. Copy a validated
# object below into the selected role profile, then add "performancecounter" to
# collectors.enabled. Do not deploy this example as an active configuration.
collector:
  performancecounter:
    objects: |-
      - name: '<UNIQUE OBJECT IDENTIFIER>'
        object: '<ENGLISH COUNTER SET NAME FROM Get-Counter -ListSet *>'
        instances:
          - '*'
        counters:
          - name: '<COUNTER NAME>'
            type: gauge
