groups:
  - name: windows_exporter.recording
    rules:
      - record: instance:windows_cpu_utilisation:rate5m
        expr: 1 - avg by (instance, job) (rate(windows_cpu_time_total{mode="idle"}[5m]))

      - record: instance:windows_memory_available_ratio
        expr: windows_memory_available_bytes / windows_memory_physical_total_bytes

      - record: instance:windows_memory_commit_ratio
        expr: windows_memory_committed_bytes / windows_memory_commit_limit

      # Fixed volumes at a drive letter or a mount path under it, such as C:
      # and E:\Data01. HarddiskVolume*, CD, and removable disks are excluded.
      # Volumes under 10GiB (EFI/Recovery) are excluded. volume_name
      # comes from windows_logical_disk_info, same join as the OLAP rules.
      # These three series feed only WindowsDiskSpaceLow and
      # WindowsDiskSpaceCritical. OLAP volumes remain included; their runway
      # alerts are separate and fire from growth, not from this ratio.
      - record: instance_volume:windows_disk_free_bytes
        expr: |
          (
            windows_logical_disk_free_bytes{volume=~"[A-Za-z]:.*"}
            and on(instance, volume)
            (windows_logical_disk_size_bytes{volume=~"[A-Za-z]:.*"} >= (10 * 1024 * 1024 * 1024))
          )
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume=~"[A-Za-z]:.*",type="fixed"}

      - record: instance_volume:windows_disk_size_bytes
        expr: |
          (
            windows_logical_disk_size_bytes{volume=~"[A-Za-z]:.*"} >= (10 * 1024 * 1024 * 1024)
          )
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume=~"[A-Za-z]:.*",type="fixed"}

      - record: instance_volume:windows_disk_free_ratio
        expr: |
          instance_volume:windows_disk_free_bytes
          / instance_volume:windows_disk_size_bytes

      - record: instance_volume:windows_logical_disk_read_latency_seconds:rate5m
        expr: |
          rate(windows_logical_disk_read_latency_seconds_total[5m])
          / clamp_min(rate(windows_logical_disk_reads_total[5m]), 1)

      - record: instance_volume:windows_logical_disk_write_latency_seconds:rate5m
        expr: |
          rate(windows_logical_disk_write_latency_seconds_total[5m])
          / clamp_min(rate(windows_logical_disk_writes_total[5m]), 1)

      - record: instance:windows_pagefile_free_ratio
        expr: windows_pagefile_free_bytes / windows_pagefile_limit_bytes

      - record: instance:windows_terminal_services_active_sessions
        expr: sum by (instance, job) (windows_terminal_services_session_info{state="active",user!=""})

      - record: instance:windows_terminal_services_disconnected_sessions
        expr: sum by (instance, job) (windows_terminal_services_session_info{state="disconnected",user!=""})

      - record: instance_mssql:buffer_cache_hit_ratio:rate5m
        expr: |
          rate(windows_mssql_bufman_buffer_cache_hits[5m])
          / clamp_min(rate(windows_mssql_bufman_buffer_cache_lookups[5m]), 1)

  # OLAP volume runway. volume_name is only on windows_logical_disk_info.
  # The selector is case-insensitive "olap", so OLAP Data, OLAP Cache,
  # "SQL Olap Data 01", and a volume named "Olap" are included.
  # Parent mounts such as E: ("SQL Disk Host") and backup U: are not.
  # Evaluated every 1m so samples stay inside Prometheus staleness (5m).
  # Growth uses the raw 7-day window, so runway does not wait for this
  # recorded series to age. deriv needs two samples; a full 7-day slope
  # appears once logical-disk history covers the window.
  # free_days is free bytes divided by this volume's own growth.
  # Growth at or below 64 MiB/day is treated as noise and produces no runway.
  # Negative growth (space being freed) produces no runway and no alert.
  - name: windows_exporter.recording.olap_disk
    interval: 1m
    rules:
      - record: instance_volume:windows_olap_disk_free_bytes
        expr: |
          windows_logical_disk_free_bytes
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume_name=~"(?i).*olap.*",type="fixed"}

      - record: instance_volume:windows_olap_disk_size_bytes
        expr: |
          windows_logical_disk_size_bytes
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume_name=~"(?i).*olap.*",type="fixed"}

      - record: instance_volume:windows_olap_disk_used_bytes
        expr: |
          (
            windows_logical_disk_size_bytes
            - windows_logical_disk_free_bytes
          )
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume_name=~"(?i).*olap.*",type="fixed"}

      - record: instance_volume:windows_olap_disk_growth_bytes_per_day
        expr: |
          deriv(
            (
              (
                windows_logical_disk_size_bytes
                - windows_logical_disk_free_bytes
              )
              * on(instance, volume) group_left(volume_name)
              windows_logical_disk_info{volume_name=~"(?i).*olap.*",type="fixed"}
            )[7d:5m]
          ) * 86400

      - record: instance_volume:windows_olap_disk_free_days
        expr: |
          instance_volume:windows_olap_disk_free_bytes
          / clamp_min(
              instance_volume:windows_olap_disk_growth_bytes_per_day > (64 * 1024 * 1024),
              1e-9
            )

      - record: instance_volume:windows_olap_disk_free_bytes:threshold_warning
        expr: 14 * (instance_volume:windows_olap_disk_growth_bytes_per_day > (64 * 1024 * 1024))

      - record: instance_volume:windows_olap_disk_free_bytes:threshold_critical
        expr: 3 * (instance_volume:windows_olap_disk_growth_bytes_per_day > (64 * 1024 * 1024))

  # Backup drive U:, including U: and mount paths such as U:\Databases\Backup01.
  # The drive letter is the selector; volume_name is not. SQL Audit on U: is
  # included because it sits on this drive. Other drives are not.
  # Same runway contract as the OLAP group: 1m evaluation, raw 7-day growth,
  # free_days = free bytes / this volume's own growth. Growth at or below
  # 64 MiB/day, and negative growth, produce no runway and no alert.
  - name: windows_exporter.recording.backup_disk
    interval: 1m
    rules:
      - record: instance_volume:windows_backup_disk_free_bytes
        expr: |
          windows_logical_disk_free_bytes
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume=~"U:.*",type="fixed"}

      - record: instance_volume:windows_backup_disk_size_bytes
        expr: |
          windows_logical_disk_size_bytes
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume=~"U:.*",type="fixed"}

      - record: instance_volume:windows_backup_disk_used_bytes
        expr: |
          (
            windows_logical_disk_size_bytes
            - windows_logical_disk_free_bytes
          )
          * on(instance, volume) group_left(volume_name)
          windows_logical_disk_info{volume=~"U:.*",type="fixed"}

      - record: instance_volume:windows_backup_disk_growth_bytes_per_day
        expr: |
          deriv(
            (
              (
                windows_logical_disk_size_bytes
                - windows_logical_disk_free_bytes
              )
              * on(instance, volume) group_left(volume_name)
              windows_logical_disk_info{volume=~"U:.*",type="fixed"}
            )[7d:5m]
          ) * 86400

      - record: instance_volume:windows_backup_disk_free_days
        expr: |
          instance_volume:windows_backup_disk_free_bytes
          / clamp_min(
              instance_volume:windows_backup_disk_growth_bytes_per_day > (64 * 1024 * 1024),
              1e-9
            )

      - record: instance_volume:windows_backup_disk_free_bytes:threshold_critical
        expr: 3 * (instance_volume:windows_backup_disk_growth_bytes_per_day > (64 * 1024 * 1024))

      # Backup path free space. Same selector as the Backup Disk Free panel
      # (volume=~"U:.*"): the U: drive and mount points such as
      # U:\Databases\Backup01. U:\Databases\Audit is included because it is on U:.
      # Evaluated every 1m so the series stays inside Prometheus staleness (5m).
      # owner is kept for Alertmanager email/SMS routing.
      # A volume whose size is 0 is dropped.
      # States match the panel's absolute thresholds:
      #   Critical  free < 10   (red)    email + SMS
      #   Warning   10 <= free < 15 (orange) email only
      #   Healthy   free >= 15  (green)  no alert
      # Value of the state series is free percent.
      - record: instance_volume:windows_backup_disk_free_percent
        expr: |
          max by (instance, job, owner, volume) (
            100 * windows_logical_disk_free_bytes{job="windows_exporter", volume=~"U:.*"}
            / (windows_logical_disk_size_bytes{job="windows_exporter", volume=~"U:.*"} > 0)
          )

      - record: instance_volume:windows_backup_disk_capacity_state
        expr: |
          label_replace(
            instance_volume:windows_backup_disk_free_percent < 10,
            "state", "Critical", "instance", ".+"
          )
          or label_replace(
            (
              instance_volume:windows_backup_disk_free_percent >= 10
            ) and (
              instance_volume:windows_backup_disk_free_percent < 15
            ),
            "state", "Warning", "instance", ".+"
          )
          or label_replace(
            instance_volume:windows_backup_disk_free_percent >= 15,
            "state", "Healthy", "instance", ".+"
          )
