# Alert profile: P0 Critical
# Copy into prometheus.yml (paths relative to the Prometheus working directory
# that contains the `rules/` folder from this package).
#
# Includes recording rules required by some P0 host expressions.
rule_files:
  - "rules/windows_exporter-recording.rules.yml"
  - "rules/windows_exporter-p0-availability.rules.yml"
  - "rules/windows_exporter-p0-host.rules.yml"
  - "rules/windows_exporter-p0-mssql.rules.yml"
