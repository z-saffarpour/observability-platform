# Constant gauges. for is 10m, so the alerts fire at 10m and not at 9m.
# mem-empty: 0 free of 1000 → exhausted and 100% used.
# mem-low: 80 free of 1000 → 92% used.
# mem-cs: older exporter, total only on windows_cs_physical_memory_bytes → 95%.
# mem-ok: 200 free of 1000 → 80% used, silent.
rule_files:
  - ../../alert-rules/platform/platform-p1-host.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'windows_os_physical_memory_free_bytes{instance="mem-empty",job="windows_exporter",owner="OK-DBA"}'
        values: '0+0x15'
      - series: 'windows_os_visible_memory_bytes{instance="mem-empty",job="windows_exporter",owner="OK-DBA"}'
        values: '1000+0x15'

      - series: 'windows_os_physical_memory_free_bytes{instance="mem-low",job="windows_exporter",owner="FMR-DBA"}'
        values: '80+0x15'
      - series: 'windows_os_visible_memory_bytes{instance="mem-low",job="windows_exporter",owner="FMR-DBA"}'
        values: '1000+0x15'

      - series: 'windows_os_physical_memory_free_bytes{instance="mem-cs",job="windows_exporter",owner="OK-DBA"}'
        values: '50+0x15'
      - series: 'windows_cs_physical_memory_bytes{instance="mem-cs",job="windows_exporter",owner="OK-DBA"}'
        values: '1000+0x15'

      - series: 'windows_os_physical_memory_free_bytes{instance="mem-ok",job="windows_exporter",owner="OK-DBA"}'
        values: '200+0x15'
      - series: 'windows_os_visible_memory_bytes{instance="mem-ok",job="windows_exporter",owner="OK-DBA"}'
        values: '1000+0x15'

    alert_rule_test:
      - eval_time: 9m
        alertname: MemoryExhausted
        exp_alerts: []
      - eval_time: 9m
        alertname: MemoryLow
        exp_alerts: []

      - eval_time: 10m
        alertname: MemoryExhausted
        exp_alerts:
          - exp_labels:
              alertname: MemoryExhausted
              severity: critical
              priority: P0
              alert_profile: host
              instance: mem-empty
              job: windows_exporter
              owner: OK-DBA
            exp_annotations:
              summary: "Physical memory exhausted on mem-empty, 0 bytes free for 10m"
              summary_fa: "حافظه فیزیکی mem-empty تمام شده است، 0 بایت آزاد برای 10 دقیقه"
              description: "mem-empty has had zero free physical memory for 10 minutes."
              runbook: "Free memory now. A live host can still have available bytes while FreePhysicalMemory is above zero, so confirm windows_memory_available_bytes too. Email and SMS follow priority P0."

      - eval_time: 10m
        alertname: MemoryLow
        exp_alerts:
          - exp_labels:
              alertname: MemoryLow
              severity: warning
              priority: P1
              alert_profile: host
              instance: mem-cs
              job: windows_exporter
              owner: OK-DBA
            exp_annotations:
              summary: "Physical memory 95% on mem-cs, above 90% for 10m"
              summary_fa: "حافظه فیزیکی mem-cs برابر 95% است، بالای 90% برای 10 دقیقه"
              description: "Physical memory usage on mem-cs is above 90%. VALUE = 95.0."
              runbook: "Find the consumers. This is free physical memory, not Windows available memory. WindowsLowAvailableMemory remains the available-memory alert below 10%. Email and SMS follow priority P1."
          - exp_labels:
              alertname: MemoryLow
              severity: warning
              priority: P1
              alert_profile: host
              instance: mem-empty
              job: windows_exporter
              owner: OK-DBA
            exp_annotations:
              summary: "Physical memory 100% on mem-empty, above 90% for 10m"
              summary_fa: "حافظه فیزیکی mem-empty برابر 100% است، بالای 90% برای 10 دقیقه"
              description: "Physical memory usage on mem-empty is above 90%. VALUE = 100.0."
              runbook: "Find the consumers. This is free physical memory, not Windows available memory. WindowsLowAvailableMemory remains the available-memory alert below 10%. Email and SMS follow priority P1."
          - exp_labels:
              alertname: MemoryLow
              severity: warning
              priority: P1
              alert_profile: host
              instance: mem-low
              job: windows_exporter
              owner: FMR-DBA
            exp_annotations:
              summary: "Physical memory 92% on mem-low, above 90% for 10m"
              summary_fa: "حافظه فیزیکی mem-low برابر 92% است، بالای 90% برای 10 دقیقه"
              description: "Physical memory usage on mem-low is above 90%. VALUE = 92.0."
              runbook: "Find the consumers. This is free physical memory, not Windows available memory. WindowsLowAvailableMemory remains the available-memory alert below 10%. Email and SMS follow priority P1."
