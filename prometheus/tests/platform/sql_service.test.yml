              severity: critical
              priority: P0
              alert_profile: mssql
              instance: sql01
              job: windows_exporter
              owner: OK-DBA
              name: MSSQL$INST
              state: running
            exp_annotations:
              summary: "SQL Server service MSSQL$INST down on sql01 for 2m 0s"
              summary_fa: "سرویس SQL Server MSSQL$INST روی sql01 به مدت 2m 0s قطع است"
              description: "Service MSSQL$INST on sql01 has been down for 2m 0s."
              runbook: "Check the SQL Server service, cluster ownership, and ERRORLOG. A host reboot is included because the service metric does not flip to stopped while the exporter is down. FDLauncher and OLAP services are excluded. Email and SMS follow priority P0."
          - exp_labels:
              alertname: SqlServerDown
              severity: critical
