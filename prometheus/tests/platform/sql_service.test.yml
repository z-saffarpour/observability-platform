# Service alerts fire at 1m after the measured downtime reaches 60s.
# At 6m the last running or last-up sample is 2m earlier, so the summary shows 2m 0s.
# SQL unavailable with no mssql_up == 1 in the 24h lookback fires at 1m and the
# summary is 1d 0h 0m 0s. Last success at 0m: OK-DBA fires at 7m, any other
# owner at 12m, and FMR-DBA at 17m. Email and SMS follow that P0 alert.
# NTP delay fires at 5m.
rule_files:
  - ../../alert-rules/platform/platform-p0-sql.rules.yml
  - ../../alert-rules/platform/platform-p1-host.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'windows_service_state{instance="sql01",job="windows_exporter",owner="OK-DBA",name="MSSQLSERVER",state="running"}'
        values: '1+0x4 0+0x4'
      - series: 'windows_service_state{instance="sql01",job="windows_exporter",owner="OK-DBA",name="MSSQLFDLauncher",state="running"}'
        values: '0+0x9'
      - series: 'windows_service_state{instance="sql01",job="windows_exporter",owner="OK-DBA",name="MSSQLServerOLAPService",state="running"}'
        values: '0+0x9'
      - series: 'windows_service_state{instance="sql01",job="windows_exporter",owner="OK-DBA",name="MSSQL$INST",state="running"}'
        values: '1+0x4 0+0x4'
      - series: 'windows_service_state{instance="sql01",job="windows_exporter",owner="OK-DBA",name="SQLSERVERAGENT",state="running"}'
        values: '1+0x4 0+0x4'
      - series: 'windows_service_state{instance="sql01",job="windows_exporter",owner="OK-DBA",name="SQLAgent$INST",state="running"}'
        values: '1+0x4 0+0x4'
      - series: 'windows_service_state{instance="sql-up",job="windows_exporter",owner="OK-DBA",name="MSSQLSERVER",state="running"}'
        values: '1+0x9'
      - series: 'up{instance="sql-up",job="windows_exporter",owner="OK-DBA"}'
        values: '1+0x9'

      - series: 'windows_service_state{instance="sql-reboot",job="windows_exporter",owner="OK-DBA",name="MSSQLSERVER",state="running"}'
        values: '1+0x9'
      - series: 'windows_service_state{instance="sql-reboot",job="windows_exporter",owner="OK-DBA",name="SQLSERVERAGENT",state="running"}'
        values: '1+0x9'
      - series: 'up{instance="sql-reboot",job="windows_exporter",owner="OK-DBA"}'
        values: '1+0x4 0+0x4'

      - series: 'windows_service_state{instance="pbi01",job="windows_exporter",owner="OK-BI-Develop",name="PowerBIReportServer",state="running"}'
        values: '1+0x4 0+0x4'
      - series: 'windows_service_state{instance="pbi-up",job="windows_exporter",owner="OK-BI-Develop",name="PowerBIReportServer",state="running"}'
        values: '1+0x9'
      - series: 'up{instance="pbi-up",job="windows_exporter",owner="OK-BI-Develop"}'
        values: '1+0x9'
      - series: 'windows_service_state{instance="pbi-reboot",job="windows_exporter",owner="OK-BI-Develop",name="PowerBIReportServer",state="running"}'
        values: '1+0x9'
      - series: 'up{instance="pbi-reboot",job="windows_exporter",owner="OK-BI-Develop"}'
        values: '1+0x4 0+0x4'

      - series: 'up{instance="sql01",job="sql_exporter",owner="OK-DBA"}'
        values: '1+0x17'
      - series: 'mssql_up{instance="sql01",job="sql_exporter",owner="OK-DBA"}'
        values: '0+0x17'
      - series: 'up{instance="sql-ok",job="sql_exporter",owner="FMR-DBA"}'
        values: '1+0x17'
      - series: 'mssql_up{instance="sql-ok",job="sql_exporter",owner="FMR-DBA"}'
        values: '1+0x17'
      - series: 'up{instance="sql-ok",job="sql_exporter_managed",owner="FMR-DBA"}'
        values: '1+0x17'
      - series: 'up{instance="sql-miss",job="sql_exporter",owner="OK-DBA"}'
        values: '1+0x17'
      - series: 'up{instance="sql-long",job="sql_exporter",owner="OK-DBA"}'
        values: '1+0x17'
      - series: 'mssql_up{instance="sql-long",job="sql_exporter",owner="OK-DBA"}'
        values: '1 0+0x17'
      - series: 'up{instance="sql-fmr",job="sql_exporter",owner="FMR-DBA"}'
        values: '1+0x17'
      - series: 'mssql_up{instance="sql-fmr",job="sql_exporter",owner="FMR-DBA"}'
        values: '1 0+0x17'
      - series: 'up{instance="sql-other",job="sql_exporter",owner="FMR-BI-Develop"}'
        values: '1+0x17'
      - series: 'mssql_up{instance="sql-other",job="sql_exporter",owner="FMR-BI-Develop"}'
        values: '1 0+0x17'
      - series: 'up{instance="sql-scrape-down",job="sql_exporter",owner="OK-DBA"}'
        values: '0+0x17'

      - series: 'windows_time_ntp_round_trip_delay_seconds{instance="ntp-slow",job="windows_exporter",owner="OK-DBA"}'
        values: '1.5+0x8'
      - series: 'windows_time_ntp_round_trip_delay_seconds{instance="ntp-ok",job="windows_exporter",owner="OK-DBA"}'
        values: '0.2+0x8'

