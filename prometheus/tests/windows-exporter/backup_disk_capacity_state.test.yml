rule_files:
  - ../../recording-rules/windows-exporter/windows_exporter-recording.rules.yml
  - ../../alert-rules/windows-exporter/windows_exporter-p0-host.rules.yml
  - ../../alert-rules/windows-exporter/windows_exporter-p1-host.rules.yml
  - ../../alert-rules/windows-exporter/windows_exporter-p2-host.rules.yml

evaluation_interval: 1m

tests:
  # Dashboard bands on one host: red < 10, orange from 10, green from 15.
  # C: is not a backup path. A zero-size U: volume is dropped.
  - interval: 1m
    input_series:
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup01"}'
        values: '4x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup01"}'
        values: '100x40'
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup02"}'
        values: '9x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup02"}'
        values: '100x40'
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:"}'
        values: '10x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:"}'
        values: '100x40'
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup03"}'
        values: '12x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup03"}'
        values: '100x40'
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup04"}'
        values: '15x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup04"}'
        values: '100x40'
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Audit"}'
        values: '40x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Audit"}'
        values: '100x40'
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Empty"}'
        values: '0x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Empty"}'
        values: '0x40'
      - series: 'windows_logical_disk_free_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="C:"}'
        values: '8x40'
      - series: 'windows_logical_disk_size_bytes{instance="srv1",job="windows_exporter",owner="OK-DBA",volume="C:"}'
        values: '100x40'
    promql_expr_test:
      - expr: instance_volume:windows_backup_disk_capacity_state
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="instance_volume:windows_backup_disk_capacity_state",instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup01",state="Critical"}'
            value: 4
          - labels: '{__name__="instance_volume:windows_backup_disk_capacity_state",instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup02",state="Critical"}'
            value: 9
          - labels: '{__name__="instance_volume:windows_backup_disk_capacity_state",instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:",state="Warning"}'
            value: 10
          - labels: '{__name__="instance_volume:windows_backup_disk_capacity_state",instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup03",state="Warning"}'
            value: 12
          - labels: '{__name__="instance_volume:windows_backup_disk_capacity_state",instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Backup04",state="Healthy"}'
            value: 15
          - labels: '{__name__="instance_volume:windows_backup_disk_capacity_state",instance="srv1",job="windows_exporter",owner="OK-DBA",volume="U:\\Databases\\Audit",state="Healthy"}'
            value: 40
    alert_rule_test:
      - eval_time: 9m
        alertname: WindowsBackupDiskFreeCritical
        exp_alerts: []
      - eval_time: 11m
        alertname: WindowsBackupDiskFreeCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P1
              alert_profile: host
              state: Critical
              instance: srv1
              job: windows_exporter
              owner: OK-DBA
              volume: 'U:\Databases\Backup01'
            exp_annotations:
              summary: "Backup volume free space below 10% on srv1 U:\\Databases\\Backup01"
              summary_fa: "فضای آزاد مسیر بکاپ روی srv1 volume U:\\Databases\\Backup01 کمتر از ۱۰٪ است"
              description: "Free space is 4.00% on backup volume U:\\Databases\\Backup01. The Backup Disk Free panel turns red below 10%. Email and SMS go to owner OK-DBA."
              impact: "Database backups can fail when this path fills."
              runbook: "Free space on the backup volume before the next full backup. Check retention and failed backup files on U:\\Databases\\Backup*."
              dashboard: "/d/winexp-00-dba-overview"
          - exp_labels:
              severity: critical
              priority: P1
              alert_profile: host
              state: Critical
              instance: srv1
              job: windows_exporter
              owner: OK-DBA
              volume: 'U:\Databases\Backup02'
            exp_annotations:
              summary: "Backup volume free space below 10% on srv1 U:\\Databases\\Backup02"
              summary_fa: "فضای آزاد مسیر بکاپ روی srv1 volume U:\\Databases\\Backup02 کمتر از ۱۰٪ است"
              description: "Free space is 9.00% on backup volume U:\\Databases\\Backup02. The Backup Disk Free panel turns red below 10%. Email and SMS go to owner OK-DBA."
              impact: "Database backups can fail when this path fills."
              runbook: "Free space on the backup volume before the next full backup. Check retention and failed backup files on U:\\Databases\\Backup*."
              dashboard: "/d/winexp-00-dba-overview"
      - eval_time: 15m
        alertname: WindowsBackupDiskFreeWarning
        exp_alerts: []
      - eval_time: 31m
        alertname: WindowsBackupDiskFreeWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P2
              alert_profile: host
              state: Warning
              instance: srv1
              job: windows_exporter
              owner: OK-DBA
              volume: 'U:'
            exp_annotations:
              summary: "Backup volume free space below 15% on srv1 U:"
              summary_fa: "فضای آزاد مسیر بکاپ روی srv1 volume U: کمتر از ۱۵٪ است"
              description: "Free space is 10.00% on backup volume U:. The Backup Disk Free panel turns orange from 10% until 15%. Email only to owner OK-DBA."
              impact: "The backup path is approaching the 10% page threshold."
              runbook: "Plan cleanup or capacity before free space drops below 10%."
              dashboard: "/d/winexp-00-dba-overview"
          - exp_labels:
              severity: warning
              priority: P2
              alert_profile: host
              state: Warning
              instance: srv1
              job: windows_exporter
              owner: OK-DBA
              volume: 'U:\Databases\Backup03'
            exp_annotations:
              summary: "Backup volume free space below 15% on srv1 U:\\Databases\\Backup03"
              summary_fa: "فضای آزاد مسیر بکاپ روی srv1 volume U:\\Databases\\Backup03 کمتر از ۱۵٪ است"
              description: "Free space is 12.00% on backup volume U:\\Databases\\Backup03. The Backup Disk Free panel turns orange from 10% until 15%. Email only to owner OK-DBA."
              impact: "The backup path is approaching the 10% page threshold."
              runbook: "Plan cleanup or capacity before free space drops below 10%."
              dashboard: "/d/winexp-00-dba-overview"
      # C: at 8% still uses the generic disk alert. U: does not.
      - eval_time: 16m
        alertname: WindowsDiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: P1
              alert_profile: host
              instance: srv1
              job: windows_exporter
              owner: OK-DBA
              volume: 'C:'
            exp_annotations:
              summary: "Low disk space on srv1 volume C:"
              summary_fa: "فضای دیسک کم روی srv1 volume C:"
              description: "Free space has remained below 10% for 15 minutes. Backup volumes on U: use WindowsBackupDiskFreeCritical."
              runbook: "Plan growth or cleanup before the critical 5% threshold."
      # U: at 4% still pages on the generic 5% rule. Alertmanager inhibits the backup P1.
      - eval_time: 11m
        alertname: WindowsDiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: P0
              alert_profile: host
              instance: srv1
              job: windows_exporter
              owner: OK-DBA
              volume: 'U:\Databases\Backup01'
            exp_annotations:
              summary: "Critical disk space on srv1 volume U:\\Databases\\Backup01"
              summary_fa: "فضای دیسک بحرانی روی srv1 volume U:\\Databases\\Backup01"
              description: "Free space is below 5% for ten minutes."
              runbook: "Free space on the volume; prioritize SQL data/log and OS drives."
