# Fixed-drive disk space. Constant samples cover the 15m Low and 10m Critical
# pending windows.
# disk-large: 2TiB with 160GiB free (~7.8%). Low percent, still above 100GiB. Silent.
# disk-low: 500GiB with 40GiB free (8%). Low only.
# disk-critical: 200GiB with 8GiB free (4%), volume_name OS. Generic critical only.
# Role volumes at the same 4% fire only their own alert:
# SQL Data 01, SQL Data01, SQL Tempdb Data 01, SQL TempdbData01,
# OLAP Data 01, SQL Olap Data 01, SQL Tempdb Log, SQL Tempdblog 01,
# SQL Log 01, SQL Log03.
# SQL Backup 01 on U: and SQL Backup 02 on E: fire only WindowsSqlBackupDiskSpaceCritical.
# A U: volume named Backup stays silent for both critical disk alerts.
# OLAP Cache at 4% stays on WindowsDiskSpaceCritical.
# disk-mount: E:\Data01, 500GiB with 40GiB free (8%). Low, same as a drive letter.
# disk-nested: U:\Databases\Backup01 is excluded from the generic disk series.
# disk-harddisk / disk-small / disk-removable: excluded before the threshold.
rule_files:
  - ../../recording-rules/windows-exporter/windows_exporter-recording.rules.yml
  - ../../alert-rules/windows-exporter/windows_exporter-p0-host.rules.yml
  - ../../alert-rules/windows-exporter/windows_exporter-p1-host.rules.yml

evaluation_interval: 1m

tests:
