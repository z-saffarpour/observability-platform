        values: '171798691840+0x20'
      - series: 'windows_logical_disk_info{instance="disk-large",job="windows_exporter",owner="OK-DBA",volume="D:",volume_name="Data",type="fixed",disk="1",filesystem="NTFS"}'
        values: '1+0x20'

