# Role pack — CDC / Change Tracking
groups:
  - name: sql_exporter.ح1.cdc
    interval: 60s
    rules:
      - alert: SqlCdcCaptureBehind
        expr: mssql_cdc_capture_lag_seconds > 300
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: cdc
          collector: mssql_cdc_change_tracking
        annotations:
          summary: "CDC capture for database {{ $labels.db }} is behind"
          summary_fa: "capture در CDC برای دیتابیس {{ $labels.db }} عقب است"
          description: "CDC high endpoint for {{ $labels.db }} is {{ $value | humanizeDuration }} behind."
          runbook: "Check CDC capture job mode/schedule and scan latency; tune threshold to RPO."
