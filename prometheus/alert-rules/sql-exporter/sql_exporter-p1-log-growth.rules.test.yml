rule_files:
  - sql_exporter-p1-performance.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # 15% of a 10 GB log: warning only (threshold 1000 MB warning, 2500 MB critical)
      - series: 'mssql:log_growth_mb:24h{db="Retail",instance="sql01",job="sql_exporter"}'
        values: '1500+0x40'
      - series: 'mssql:log_growth_mb:threshold_warning{db="Retail",instance="sql01",job="sql_exporter"}'
        values: '1000+0x40'
      - series: 'mssql:log_growth_mb:threshold_critical{db="Retail",instance="sql01",job="sql_exporter"}'
        values: '2500+0x40'
      # 37.5% of an 8 GB log: warning and critical
      - series: 'mssql:log_growth_mb:24h{db="Warehouse",instance="sql01",job="sql_exporter"}'
        values: '3000+0x40'
      - series: 'mssql:log_growth_mb:threshold_warning{db="Warehouse",instance="sql01",job="sql_exporter"}'
        values: '800+0x40'
      - series: 'mssql:log_growth_mb:threshold_critical{db="Warehouse",instance="sql01",job="sql_exporter"}'
        values: '2000+0x40'
      # 5 GB growth on a 100 GB log is under 10%: no alert
      - series: 'mssql:log_growth_mb:24h{db="Dynamics",instance="sql01",job="sql_exporter"}'
        values: '5000+0x40'
      - series: 'mssql:log_growth_mb:threshold_warning{db="Dynamics",instance="sql01",job="sql_exporter"}'
        values: '10240+0x40'
      - series: 'mssql:log_growth_mb:threshold_critical{db="Dynamics",instance="sql01",job="sql_exporter"}'
        values: '25600+0x40'
      # 40% but only 40 MB: under the 64 MB noise floor
      - series: 'mssql:log_growth_mb:24h{db="Tiny",instance="sql01",job="sql_exporter"}'
        values: '40+0x40'
      - series: 'mssql:log_growth_mb:threshold_warning{db="Tiny",instance="sql01",job="sql_exporter"}'
        values: '10+0x40'
      - series: 'mssql:log_growth_mb:threshold_critical{db="Tiny",instance="sql01",job="sql_exporter"}'
        values: '25+0x40'
      # System database excluded
      - series: 'mssql:log_growth_mb:24h{db="tempdb",instance="sql01",job="sql_exporter"}'
        values: '8000+0x40'
      - series: 'mssql:log_growth_mb:threshold_warning{db="tempdb",instance="sql01",job="sql_exporter"}'
        values: '100+0x40'
      - series: 'mssql:log_growth_mb:threshold_critical{db="tempdb",instance="sql01",job="sql_exporter"}'
        values: '250+0x40'

    alert_rule_test:
      - eval_time: 35m
        alertname: SqlDatabaseLogGrowthHigh
        exp_alerts:
          - exp_labels:
              alertname: SqlDatabaseLogGrowthHigh
              severity: warning
              priority: P1
              alert_profile: performance
              collector: mssql_database_size_growth
              db: Retail
              instance: sql01
              job: sql_exporter
            exp_annotations:
              summary: "Transaction log grew beyond this database threshold"
              description: "Log for Retail on sql01 grew 1500 MB in 24h. Warning starts at 10% of this database's current log size, and only above 64 MB."
              runbook: "Check log_reuse_wait, log backups, long transactions, AG or replication, and index maintenance. SMS follows priority P1. A planned log expand matches this alert too."
          - exp_labels:
              alertname: SqlDatabaseLogGrowthHigh
              severity: warning
              priority: P1
              alert_profile: performance
              collector: mssql_database_size_growth
              db: Warehouse
              instance: sql01
              job: sql_exporter
            exp_annotations:
              summary: "Transaction log grew beyond this database threshold"
              description: "Log for Warehouse on sql01 grew 3000 MB in 24h. Warning starts at 10% of this database's current log size, and only above 64 MB."
              runbook: "Check log_reuse_wait, log backups, long transactions, AG or replication, and index maintenance. SMS follows priority P1. A planned log expand matches this alert too."
      - eval_time: 35m
        alertname: SqlDatabaseLogGrowthCritical
        exp_alerts:
          - exp_labels:
              alertname: SqlDatabaseLogGrowthCritical
              severity: critical
              priority: P0
              alert_profile: performance
              collector: mssql_database_size_growth
              db: Warehouse
              instance: sql01
              job: sql_exporter
            exp_annotations:
              summary: "Transaction log grew beyond the critical threshold for this database"
              description: "Log for Warehouse on sql01 grew 3000 MB in 24h. Critical starts at 25% of this database's current log size, and only above 64 MB."
              runbook: "Treat as log-growth emergency for this database. Find the reuse blocker before the volume fills. SMS follows priority P0."
