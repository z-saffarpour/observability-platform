# P2 — Medium performance / capacity signals
groups:
  - name: sql_exporter.p2.performance
    interval: 60s
    rules:
      - alert: SqlResourceGovernorPressure
        expr: mssql_resource_governor_pool_memgrant_waiter_count > 0 or mssql_resource_governor_group_queued_requests > 0
        for: 5m
        labels:
          severity: warning
          priority: P2
          alert_profile: performance
          collector: mssql_resource_governor
        annotations:
          summary: "Resource Governor workload is queued"
          summary_fa: "بار کاری Resource Governor در صف است"
          description: "Pool {{ $labels.pool }} workload group {{ $labels.workload_group }} has sustained pressure."
          runbook: "Review RG pool limits and queued requests; ignore if RG is unused."

      - alert: SqlWaitPressureHigh
        expr: mssql_waits_nonbenign_percent > 80
        for: 15m
        labels:
          severity: warning
          priority: P2
          alert_profile: performance
          collector: mssql_waits
        annotations:
          summary: "Non-benign waits dominate SQL Server wait time"
          summary_fa: "waitهای غیرعادی بخش عمده زمان انتظار SQL Server هستند"
          description: "Non-benign waits account for {{ $value | humanize }}% of cumulative wait time."
          runbook: "Break down top wait classes and correlate with CPU/IO/blocking."
