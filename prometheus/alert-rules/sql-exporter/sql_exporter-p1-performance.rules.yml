# P1 — High performance pressure
groups:
  - name: sql_exporter.p1.performance
    interval: 30s
    rules:
      - alert: SqlServerCpuHigh
        expr: mssql_cpu_sqlserver_process_percent > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_cpu
        annotations:
          summary: "SQL Server CPU usage is high"
          summary_fa: "مصرف CPU در SQL Server بالا است"
          description: "SQL Server process CPU is {{ $value | humanize }}%."
          runbook: "Check top consumers (heavy queries, parallelism, other processes). Tune threshold per instance baseline."

      - alert: SqlTransactionLogUsageHigh
        expr: mssql_log_used_percent{db!~"tempdb|master|msdb|model|SqlDeep|model_msdb"} > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_log_usage
        annotations:
          summary: "Transaction log usage is high for database {{ $labels.db }}"
          summary_fa: "مصرف لاگ تراکنش دیتابیس {{ $labels.db }} بالا است"
          description: "Transaction log for {{ $labels.db }} is {{ $value | humanize }}% used."
          runbook: "Check log_reuse_wait, long transactions, AG/replication lag, and log backup schedule."

      - alert: SqlSystemDbTransactionLogUsageHigh
        expr: mssql_log_used_percent_system{db=~"tempdb|msdb"} > 92
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_log_usage
        annotations:
          summary: "Transaction log usage is high for system database {{ $labels.db }}"
          summary_fa: "مصرف لاگ تراکنش دیتابیس سیستمی {{ $labels.db }} بالا است"
          description: "Transaction log for system database {{ $labels.db }} is {{ $value | humanize }}% used."
          runbook: "Check tempdb/msdb log reuse wait, long transactions, and log growth. master/model are tracked separately and do not fire this alert."
