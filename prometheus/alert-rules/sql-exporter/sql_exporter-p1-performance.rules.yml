# P1 — High performance pressure
groups:
  - name: sql_exporter.p1.performance
    interval: 30s
    rules:
      - alert: SqlServerCpuHigh
        expr: mssql_cpu_sqlserver_process_percent > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_cpu
        annotations:
          summary: "SQL Server CPU usage is high"
          summary_fa: "مصرف CPU در SQL Server بالا است"
          description: "SQL Server process CPU is {{ $value | humanize }}%."
          runbook: "Check top consumers (heavy queries, parallelism, other processes). Tune threshold per instance baseline."

      - alert: SqlFileIoLatencyHigh
        expr: mssql_file_io_avg_read_latency_ms > 20 or mssql_file_io_avg_write_latency_ms > 20
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_file_io
        annotations:
          summary: "File I/O latency is high for database {{ $labels.db }}"
          summary_fa: "تأخیر I/O فایل دیتابیس {{ $labels.db }} بالا است"
          description: "File {{ $labels.logical_name }} in {{ $labels.db }} exceeds 20 ms average latency."
          runbook: "Inspect storage latency, pending I/O, and file placement. Exclude idle/archive DBs if noisy."

      - alert: SqlTransactionLogUsageHigh
        expr: mssql_log_used_percent > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_log_usage
        annotations:
          summary: "Transaction log usage is high for database {{ $labels.db }}"
          summary_fa: "مصرف لاگ تراکنش دیتابیس {{ $labels.db }} بالا است"
          description: "Transaction log for {{ $labels.db }} is {{ $value | humanize }}% used."
          runbook: "Check log_reuse_wait, long transactions, AG/replication lag, and log backup schedule."

      - alert: SqlSystemDbTransactionLogUsageHigh
        expr: mssql_log_used_percent_system{db=~"tempdb|msdb"} > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_log_usage
        annotations:
          summary: "Transaction log usage is high for system database {{ $labels.db }}"
          summary_fa: "مصرف لاگ تراکنش دیتابیس سیستمی {{ $labels.db }} بالا است"
          description: "Transaction log for system database {{ $labels.db }} is {{ $value | humanize }}% used."
          runbook: "Check tempdb/msdb log reuse wait, long transactions, and log growth. master/model are tracked separately and do not fire this alert."

      - alert: SqlDatabaseLogGrowthHigh
        expr: |
          (
            mssql:log_growth_mb:24h{db!~"master|model|msdb|tempdb"}
            > mssql:log_growth_mb:threshold_warning{db!~"master|model|msdb|tempdb"}
          )
          and
          mssql:log_growth_mb:24h{db!~"master|model|msdb|tempdb"} > 64
        for: 30m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_database_size_growth
        annotations:
          summary: "Transaction log for database {{ $labels.db }} grew beyond its threshold"
          summary_fa: "لاگ تراکنش دیتابیس {{ $labels.db }} از آستانه خودش فراتر رفته است"
          description: "Log for {{ $labels.db }} on {{ $labels.instance }} grew {{ $value | printf \"%.0f\" }} MB in 24h. Warning starts at 10% of this database's current log size, and only above 64 MB."
          runbook: "Check log_reuse_wait, log backups, long transactions, AG or replication, and index maintenance. SMS follows priority P1. A planned log expand matches this alert too."

      - alert: SqlDatabaseLogGrowthCritical
        expr: |
          (
            mssql:log_growth_mb:24h{db!~"master|model|msdb|tempdb"}
            > mssql:log_growth_mb:threshold_critical{db!~"master|model|msdb|tempdb"}
          )
          and
          mssql:log_growth_mb:24h{db!~"master|model|msdb|tempdb"} > 64
        for: 15m
        labels:
          severity: critical
          priority: P0
          alert_profile: performance
          collector: mssql_database_size_growth
        annotations:
          summary: "Transaction log for database {{ $labels.db }} grew beyond its critical threshold"
          summary_fa: "لاگ تراکنش دیتابیس {{ $labels.db }} از آستانه بحرانی فراتر رفته است"
          description: "Log for {{ $labels.db }} on {{ $labels.instance }} grew {{ $value | printf \"%.0f\" }} MB in 24h. Critical starts at 25% of this database's current log size, and only above 64 MB."
          runbook: "Treat as log-growth emergency for this database. Find the reuse blocker before the volume fills. SMS follows priority P0."

      - alert: SqlBlockingPersistent
        expr: mssql_blocking_count > 0
        for: 5m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_blocking
        annotations:
          summary: "Persistent SQL Server blocking"
          summary_fa: "blocking پایدار در SQL Server"
          description: "{{ $value }} blocked requests have persisted for five minutes."
          runbook: "Identify head blocker, wait type, and blocking chain. Kill only when safe and approved."

      - alert: SqlMemoryGrantPressure
        expr: mssql_memory_grants_pending > 0 or mssql_resource_semaphore_waiter_count > 0
        for: 5m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_memory
        annotations:
          summary: "SQL Server memory grant pressure"
          summary_fa: "فشار memory grant در SQL Server"
          description: "Queries have waited for memory grants for at least five minutes."
          runbook: "Review large sorts/hashes, max server memory, Resource Governor, and concurrent grants."

      - alert: SqlTempdbPressure
        expr: mssql_tempdb_waiting_tasks_count > 0 or mssql_tempdb_version_store_mb > 10240
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_tempdb
        annotations:
          summary: "tempdb pressure detected"
          summary_fa: "فشار روی tempdb شناسایی شد"
          description: "tempdb has waiting tasks or version store exceeds 10 GiB."
          runbook: "Check version-store consumers, spill queries, and tempdb file layout/contention."

      - alert: SqlBufferPoolLifeExpectancyLow
        expr: mssql_buffer_pool_page_life_expectancy > 0 and mssql_buffer_pool_page_life_expectancy < 300
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_buffer_pool
        annotations:
          summary: "Buffer pool page life expectancy is low"
          summary_fa: "page life expectancy در buffer pool پایین است"
          description: "PLE for {{ $labels.instance }} is {{ $value }} seconds."
          runbook: "Review memory pressure, large scans, and max server memory."

      - alert: SqlSchedulerPressure
        expr: mssql_scheduler_total_runnable > 4 or mssql_scheduler_total_work_queue > 0
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_scheduler
        annotations:
          summary: "SQL Server scheduler pressure"
          summary_fa: "فشار scheduler در SQL Server"
          description: "Runnable tasks or work queue remained elevated for ten minutes."
          runbook: "Correlate with CPU, CXPACKET/SOS_SCHEDULER_YIELD waits, and heavy queries."

      - alert: SqlLockWaitPersistent
        expr: mssql_locks_waiting > 0
        for: 5m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_locks
        annotations:
          summary: "Persistent lock wait detected"
          summary_fa: "انتظار قفل پایدار شناسایی شد"
          description: "Session {{ $labels.session_id }} is waiting on a lock."
          runbook: "Inspect blocking chain and lock mode; relate to SqlBlockingPersistent."

      - alert: SqlLongRunningRequest
        expr: mssql_requests_elapsed_ms > 300000
        for: 5m
        labels:
          severity: warning
          priority: P1
          alert_profile: performance
          collector: mssql_heavy_queries
        annotations:
          summary: "A SQL request in database {{ $labels.db }} has run for more than five minutes"
          summary_fa: "یک درخواست SQL در دیتابیس {{ $labels.db }} بیش از پنج دقیقه در حال اجراست"
          description: "Session {{ $labels.session_id }} in {{ $labels.db }} has elapsed {{ $value | humanize }} ms."
          runbook: "Review query text/plan, waits, and whether the request is expected batch work."
