# P1 — High SQL Agent job history signals
groups:
  - name: sql_exporter.p1.jobs
    interval: 60s
    rules:
      - alert: SqlAgentJobRecentFailure
        expr: mssql_job_history_failed_total > 0
        for: 5m
        labels:
          severity: warning
          priority: P1
          alert_profile: jobs
          collector: mssql_job_history
        annotations:
          summary: "SQL Agent job has failures in the history window"
          description: "Job {{ $labels.job_name }} has {{ $value }} failures in the collector window."
          runbook: "Review job history outcomes and correlate with SqlAgentJobFailed if still failing."

      - alert: SqlAgentJobLastRunFailed
        expr: mssql_job_last_run_outcome == 0
        for: 5m
        labels:
          severity: warning
          priority: P1
          alert_profile: jobs
          collector: mssql_job_inventory
        annotations:
          summary: "Last SQL Agent job run failed"
          description: "The last run of job {{ $labels.job_name }} failed."
          runbook: "Open the last failed step and decide whether to re-run or mute non-critical jobs."
