# P0 — Critical availability (databases, backup, integrity, restore, scrape)
groups:
  - name: sql_exporter.p0.availability
    interval: 30s
    rules:
      - alert: SqlExporterDown
        expr: up{job=~"sql.*"} == 0
        for: 5m
        labels:
          severity: critical
          priority: P0
          alert_profile: availability
          collector: scrape
        annotations:
          summary: "sql_exporter is unavailable on {{ $labels.instance }}"
          summary_fa: "sql_exporter روی {{ $labels.instance }} در دسترس نیست"
          description: "Prometheus has failed to scrape the SQL exporter target for five minutes."
          runbook: "Check service prometheus_sql_exporter, port 9399, firewall, and scrape Basic Auth."

      - alert: SqlDatabaseNotOnline
        expr: mssql_database_state != 0
        for: 5m
        labels:
          severity: critical
          priority: P0
          alert_profile: availability
          collector: mssql_standard
        annotations:
          summary: "Database {{ $labels.db }} is {{ $labels.state_desc }}, not ONLINE"
          summary_fa: "دیتابیس {{ $labels.db }} در وضعیت {{ $labels.state_desc }} است و ONLINE نیست"
          description: "Database {{ $labels.db }} state code is {{ $value }}."
          runbook: "Check database state (SUSPECT/RECOVERING/OFFLINE). Review ERRORLOG and recent failovers."

      - alert: SqlRestoreSecondaryBehindRpo
        expr: mssql_restore_gap_to_rpo_seconds > 1800
        for: 10m
        labels:
          severity: critical
          priority: P0
          alert_profile: availability
          collector: mssql_restore
        annotations:
          summary: "Restore secondary for database {{ $labels.db }} is behind its sample RPO"
          summary_fa: "secondary بازیابی دیتابیس {{ $labels.db }} از RPO نمونه عقب است"
          description: "Restore gap for {{ $labels.db }} is {{ $value | humanizeDuration }}."
          runbook: "Check restore/log-shipping jobs, file share access, and RPO threshold (sample 30m)."
