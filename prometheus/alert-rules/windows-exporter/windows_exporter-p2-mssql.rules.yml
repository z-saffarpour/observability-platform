groups:
  - name: windows_exporter.p2.mssql
    rules:
      - alert: MssqlLongRunningTransaction
        expr: windows_mssql_transactions_longest_transaction_running_seconds > 3600
        for: 15m
        labels:
          severity: warning
          priority: P2
          alert_profile: mssql
        annotations:
          summary: "Long-running SQL transaction on {{ $labels.instance }}"
          summary_fa: "تراکنش طولانی SQL روی {{ $labels.instance }}"
          description: "Longest transaction has been running for {{ $value | humanizeDuration }}."
          runbook: "Identify open tran sessions; check impact on log reuse and blocking."

      - alert: MssqlSqlErrors
        expr: increase(windows_mssql_sql_errors_total[15m]) > 5
        labels:
          severity: warning
          priority: P2
          alert_profile: mssql
        annotations:
          summary: "SQL errors increased on {{ $labels.instance }}"
          summary_fa: "خطاهای SQL روی {{ $labels.instance }} افزایش یافته است"
          description: "{{ $value }} SQL errors in 15 minutes (severity {{ $labels.severity }})."
          runbook: "Inspect SQL error log for the matching severity."

      - alert: MssqlTempdbFreeSpaceLow
        expr: windows_mssql_transactions_tempdb_free_space_bytes < 1e9
        for: 15m
        labels:
          severity: info
          priority: P3
          alert_profile: mssql
        annotations:
          summary: "tempdb free space low on {{ $labels.instance }}"
          summary_fa: "فضای آزاد tempdb روی {{ $labels.instance }} کم است"
          description: "tempdb free space is {{ $value | humanize }}B (default threshold 1GB)."
          runbook: "Check version store, temp objects, and tempdb file layout."

      - alert: MssqlUserConnectionsHigh
        expr: windows_mssql_genstats_user_connections > 500
        for: 20m
        labels:
          severity: warning
          priority: P2
          alert_profile: mssql
        annotations:
          summary: "High SQL user connections on {{ $labels.instance }}"
          summary_fa: "تعداد اتصال کاربر SQL روی {{ $labels.instance }} بالا است"
          description: "User connections are {{ $value }} (default threshold 500). Tune per instance capacity."
          runbook: "Check connection pooling and abandoned sessions."
