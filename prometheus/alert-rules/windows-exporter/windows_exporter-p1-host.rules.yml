groups:
  - name: windows_exporter.p1.host
    rules:
      - alert: WindowsHighCPU
        expr: instance:windows_cpu_utilisation:rate5m > 0.85
        for: 15m
        labels:
          severity: warning
          priority: P1
          alert_profile: host
        annotations:
          summary: "CPU {{ $value | humanizePercentage }} on {{ $labels.instance }}, above 85% for 15m"
          summary_fa: "CPU روی {{ $labels.instance }} برابر {{ $value | humanizePercentage }} است، بالای 85% برای 15 دقیقه"
          description: "Average CPU utilization has exceeded 85% for 15 minutes."
          runbook: "Correlate with windows_process_cpu_time_total and SQL batch requests."

      - alert: WindowsLowAvailableMemory
        expr: instance:windows_memory_available_ratio < 0.10
        for: 10m
        labels:
          severity: warning
          priority: P1
          alert_profile: host
        annotations:
          summary: "Low available memory on {{ $labels.instance }}"
          summary_fa: "حافظه آزاد کم روی {{ $labels.instance }}"
          description: "Available memory has remained below 10% for ten minutes."
          runbook: "Check SQL memory target, working sets, and external consumers."

      # U: is absent from instance_volume:windows_disk_free_*.
      # Backup runway and backup percent alerts own that drive.
      - alert: WindowsDiskSpaceLow
        expr: |
          (
            instance_volume:windows_disk_free_ratio < 0.10
            and
            instance_volume:windows_disk_free_bytes < (100 * 1024 * 1024 * 1024)
          )
          unless
          (
            instance_volume:windows_disk_free_ratio < 0.05
            and
            instance_volume:windows_disk_free_bytes < (30 * 1024 * 1024 * 1024)
          )
        for: 15m
        labels:
          severity: warning
          priority: P1
          alert_profile: host
        annotations:
          summary: '{{ $labels.volume_name }} {{ $labels.volume }} on {{ $labels.instance }}: {{ with printf "max(instance_volume:windows_disk_free_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} free of {{ with printf "max(instance_volume:windows_disk_size_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} ({{ $value | humanizePercentage }} free)'
          summary_fa: '{{ $labels.volume_name }} {{ $labels.volume }} روی {{ $labels.instance }}: {{ with printf "max(instance_volume:windows_disk_free_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} آزاد از {{ with printf "max(instance_volume:windows_disk_size_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} ({{ $value | humanizePercentage }} آزاد)'
          description: "Volume {{ $labels.volume }} ({{ $labels.volume_name }}) on {{ $labels.instance }} has been below 10% free and below 100GiB for 15 minutes, and is not below both 5% and 30GiB."
          runbook: "Free space or extend the volume before free space drops under 5% and 30GiB. Prioritize SQL data, log, and OS drives. Compare instance_volume:windows_disk_free_bytes with instance_volume:windows_disk_size_bytes."

      - alert: WindowsOlapDiskFreeSpaceLow
        expr: |
          instance_volume:windows_olap_disk_free_days < 14
          and
          instance_volume:windows_olap_disk_growth_bytes_per_day > (64 * 1024 * 1024)
        for: 1h
        labels:
          severity: warning
          priority: P1
          alert_profile: ssas
        annotations:
          summary: '{{ $labels.volume_name }} {{ $labels.volume }} on {{ $labels.instance }}: {{ with printf "max(instance_volume:windows_olap_disk_free_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} free of {{ with printf "max(instance_volume:windows_olap_disk_size_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} ({{ $value | printf "%.1f" }}d left)'
          summary_fa: '{{ $labels.volume_name }} {{ $labels.volume }} روی {{ $labels.instance }}: {{ with printf "max(instance_volume:windows_olap_disk_free_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} آزاد از {{ with printf "max(instance_volume:windows_olap_disk_size_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} ({{ $value | printf "%.1f" }} روز مانده)'
          description: "OLAP volume {{ $labels.volume }} ({{ $labels.volume_name }}) on {{ $labels.instance }} has {{ $value | printf \"%.1f\" }} days of free space left at its 7-day growth rate. The free-byte threshold is 14 times that volume's own daily growth, not a fixed size."
          runbook: "Compare instance_volume:windows_olap_disk_free_bytes with instance_volume:windows_olap_disk_free_bytes:threshold_warning. Extend the OLAP data or cache volume, or free space, before processing fills it. SMS follows priority P1."

      # 14-day runway. The 3-day alert is WindowsBackupDiskFreeSpaceCritical.
      # Alertmanager suppresses this warning when that P0 alert is firing.
      - alert: WindowsBackupDiskFreeSpaceLow
        expr: |
          instance_volume:windows_backup_disk_free_days < 14
          and
          instance_volume:windows_backup_disk_growth_bytes_per_day > (64 * 1024 * 1024)
        for: 1h
        labels:
          severity: warning
          priority: P1
          alert_profile: host
        annotations:
          summary: '{{ $labels.volume_name }} {{ $labels.volume }} on {{ $labels.instance }}: {{ with printf "max(instance_volume:windows_backup_disk_free_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} free of {{ with printf "max(instance_volume:windows_backup_disk_size_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} ({{ $value | printf "%.1f" }}d left)'
          summary_fa: '{{ $labels.volume_name }} {{ $labels.volume }} روی {{ $labels.instance }}: {{ with printf "max(instance_volume:windows_backup_disk_free_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} آزاد از {{ with printf "max(instance_volume:windows_backup_disk_size_bytes{instance=%q,volume=%q,volume_name=%q})" $labels.instance $labels.volume $labels.volume_name | query }}{{ . | first | value | humanize1024 }}{{ end }} ({{ $value | printf "%.1f" }} روز مانده)'
          description: "Backup volume {{ $labels.volume }} ({{ $labels.volume_name }}) on {{ $labels.instance }} has {{ $value | printf \"%.1f\" }} days of free space left at its 7-day growth rate. The free-byte threshold is 14 times that volume's own daily growth, not a fixed size."
          runbook: "Compare instance_volume:windows_backup_disk_free_bytes with instance_volume:windows_backup_disk_free_bytes:threshold_warning. Extend the backup volume or remove expired backups before the volume fills. SMS follows priority P1."

      # Dashboard red band. priority P1 routes email and SMS to the server owner.
      # Suppressed while the 14-day or 3-day runway alert is already firing.
      # Volumes already below 5% also match WindowsDiskSpaceCritical (P0);
      # Alertmanager inhibits this alert for that case.
      - alert: WindowsBackupDiskFreeCritical
        expr: instance_volume:windows_backup_disk_capacity_state{state="Critical"}
        for: 10m
        labels:
          severity: critical
          priority: P1
          alert_profile: host
        annotations:
          summary: "Backup volume free space below 10% on {{ $labels.instance }} {{ $labels.volume }}"
          summary_fa: "فضای آزاد مسیر بکاپ روی {{ $labels.instance }} volume {{ $labels.volume }} کمتر از ۱۰٪ است"
          description: "Free space is {{ $value | printf \"%.2f\" }}% on backup volume {{ $labels.volume }}. The Backup Disk Free panel turns red below 10%. Email and SMS go to owner {{ $labels.owner }}."
          impact: "Database backups can fail when this path fills."
          runbook: "Free space on the backup volume before the next full backup. Check retention and failed backup files on U:\\Databases\\Backup*."
          dashboard: "/d/winexp-00-dba-overview"

      - alert: WindowsDiskReadLatencyHigh
        expr: |
          instance_volume:windows_logical_disk_read_latency_seconds:rate5m > 0.05
          and rate(windows_logical_disk_reads_total[5m]) > 1
        for: 15m
        labels:
          severity: info
          priority: P3
          alert_profile: host
        annotations:
          summary: "High disk read latency on {{ $labels.instance }} volume {{ $labels.volume }}"
          summary_fa: "تأخیر خواندن دیسک بالا روی {{ $labels.instance }} volume {{ $labels.volume }}"
          description: "Average read latency is above 50ms for 15 minutes."
          runbook: "Check storage queue depth, antivirus scans, and SQL IO waits."

      - alert: WindowsDiskWriteLatencyHigh
        expr: |
          instance_volume:windows_logical_disk_write_latency_seconds:rate5m > 0.05
          and rate(windows_logical_disk_writes_total[5m]) > 1
        for: 15m
        labels:
          severity: info
          priority: P3
          alert_profile: host
        annotations:
          summary: "High disk write latency on {{ $labels.instance }} volume {{ $labels.volume }}"
          summary_fa: "تأخیر نوشتن دیسک بالا روی {{ $labels.instance }} volume {{ $labels.volume }}"
          description: "Average write latency is above 50ms for 15 minutes."
          runbook: "Check log/tempdb placement, storage latency, and checkpoint spikes."

      - alert: WindowsCommitChargeHigh
        expr: instance:windows_memory_commit_ratio > 0.90
        for: 15m
        labels:
          severity: info
          priority: P3
          alert_profile: host
        annotations:
          summary: "High commit charge on {{ $labels.instance }}"
          summary_fa: "commit charge بالا روی {{ $labels.instance }}"
          description: "Committed memory is above 90% of the commit limit."
          runbook: "Review pagefile and process private bytes before reaching critical."
