groups:
  - name: windows_exporter.p0.availability
    rules:
      - alert: WindowsExporterDown
        expr: up{job=~"windows.*"} == 0
        for: 5m
        labels:
          severity: critical
          priority: P0
          alert_profile: availability
        annotations:
          summary: "Windows host {{ $labels.instance }} is down"
          summary_fa: "سرور Windows {{ $labels.instance }} در دسترس نیست"
          description: "Prometheus has not scraped this Windows host for five minutes. The host may be shut down, crashed, or unreachable. A stopped windows_exporter produces the same signal."
          runbook: "Confirm whether the host was shut down. Check power, network, firewall, port 9182, and the windows_exporter service. Email and SMS follow priority P0."

      # windows_system_system_up_time is the Unix boot timestamp, not uptime.
      # Uptime is time() minus that gauge. A reboot moves the timestamp forward.
      # The alert fires while the 15m offset still sees the previous boot and
      # current uptime is under 30m, then resolves. P0 sends email and SMS.
      - alert: WindowsHostRestarted
        expr: |
          (
            (
              windows_system_system_up_time{job=~"windows.*"}
              -
              windows_system_system_up_time{job=~"windows.*"} offset 15m
            ) > 120
          )
          and
          (
            (time() - windows_system_system_up_time{job=~"windows.*"}) < 1800
          )
          and
          (
            (time() - windows_system_system_up_time{job=~"windows.*"}) >= 0
          )
          and on (instance, job, owner)
          (
            up{job=~"windows.*"} == 1
          )
        for: 2m
        labels:
          severity: critical
          priority: P0
          alert_profile: availability
        annotations:
          summary: "Windows host {{ $labels.instance }} restarted"
          summary_fa: "سرور Windows {{ $labels.instance }} restart شده است"
          description: "Boot time on {{ $labels.instance }} moved forward {{ $value | printf \"%.0f\" }}s within 15 minutes, and uptime is still under 30 minutes."
          runbook: "Confirm the reboot was planned. Check System event IDs 1074, 6006, 6008, and 41. Verify SQL Server, Agent, and cluster services are running. Email and SMS follow priority P0."

      - alert: WindowsExporterCollectorFailed
        expr: windows_exporter_collector_success == 0
        for: 10m
        labels:
          severity: critical
          priority: P0
          alert_profile: availability
        annotations:
          summary: "Collector {{ $labels.collector }} failed on {{ $labels.instance }}"
          summary_fa: "collector {{ $labels.collector }} روی {{ $labels.instance }} خطا دارد"
          description: "The collector has reported failure for ten minutes. Metrics from this collector may be missing or stale."
          runbook: "Inspect windows_exporter event log and collector permissions."

      - alert: DataPlatformServiceNotRunning
        expr: |
          windows_service_state{
            state="running",
            name=~"(?i)(MSSQLSERVER|SQLSERVERAGENT|MSSQL\\$.+|SQLAgent\\$.+|MSSQLServerOLAPService|MSOLAP\\$.+|PowerBIReportServer|PBIRS.*|SQLServerReportingServices|ReportServer.*|ClusSvc)"
          } == 0
        for: 3m
        labels:
          severity: critical
          priority: P0
          alert_profile: data-platform
        annotations:
          summary: "Service {{ $labels.name }} is not running on {{ $labels.instance }}"
          summary_fa: "سرویس {{ $labels.name }} روی {{ $labels.instance }} در حال اجرا نیست"
          description: "A monitored SQL Server, SSAS, PBIRS, or Cluster service has not been running for three minutes."
          runbook: "Check Windows Services, cluster ownership, and recent Event Log errors."

      - alert: MssqlCollectorFailed
        expr: windows_mssql_collector_success == 0
        for: 10m
        labels:
          severity: critical
          priority: P0
          alert_profile: mssql
        annotations:
          summary: "MSSQL collector {{ $labels.collector }} failed on {{ $labels.instance }}"
          summary_fa: "MSSQL collector {{ $labels.collector }} روی {{ $labels.instance }} خطا دارد"
          description: "A windows_exporter MSSQL sub-collector has failed for ten minutes."
          runbook: "Verify SQL instance is up and the exporter service account can read SQL performance counters."

      - alert: WindowsTimeSkewCritical
        expr: abs(windows_time_computed_time_offset_seconds) > 5
        for: 5m
        labels:
          severity: critical
          priority: P0
          alert_profile: host
        annotations:
          summary: "Clock skew on {{ $labels.instance }}"
          summary_fa: "اختلاف ساعت روی {{ $labels.instance }}"
          description: "Windows time offset is {{ $value | humanize }}s (threshold 5s). Kerberos, Always On, and certificate auth can fail."
          runbook: "Check W32Time / NTP source and domain time hierarchy."
