# P0 — SQL Server engine service, SQL Server Agent service, and SQL query up.
# Service names are matched case-insensitively. windows_exporter publishes `name`.
# DataPlatformServiceNotRunning still covers SSAS, PBIRS, and the cluster service.
groups:
  - name: platform.p0.sql
    rules:
      - alert: SqlServerDown
        expr: |
          (
            windows_service_state{state="running", name=~"(?i)^mssql.+"} == 0
            unless
            windows_service_state{state="running", name=~"(?i).*fdlaunch.*"}
            unless
            windows_service_state{state="running", name=~"(?i).*olap.*"}
          )
        for: 3m
        labels:
          severity: critical
          priority: P0
          alert_profile: mssql
        annotations:
          summary: "SQL Server service {{ $labels.name }} down on {{ $labels.instance }} for 3m"
          summary_fa: "سرویس SQL Server {{ $labels.name }} روی {{ $labels.instance }} برای 3 دقیقه قطع است"
          description: "Service {{ $labels.name }} on {{ $labels.instance }} has not been running for 3 minutes."
          runbook: "Check the SQL Server service, cluster ownership, and ERRORLOG. FDLauncher and OLAP services are excluded. Email and SMS follow priority P0."

      - alert: SqlServerAgentDown
        expr: |
          windows_service_state{
            state="running",
            name=~"(?i)^sql(serveragent|agent\\x24.+)"
          } == 0
        for: 3m
        labels:
          severity: critical
          priority: P0
          alert_profile: mssql
        annotations:
          summary: "SQL Server Agent service {{ $labels.name }} down on {{ $labels.instance }} for 3m"
          summary_fa: "سرویس SQL Server Agent {{ $labels.name }} روی {{ $labels.instance }} برای 3 دقیقه قطع است"
          description: "Service {{ $labels.name }} on {{ $labels.instance }} has not been running for 3 minutes."
          runbook: "Check SQL Server Agent and SQL Server Agent jobs. Email and SMS follow priority P0."

      # mssql_up is 1 when SELECT 1 succeeds. A failed SQL connection usually
      # omits the series instead of publishing 0. Match on instance only so a
      # second sql job for the same host does not page when another job already
      # has mssql_up == 1. Priority P3 keeps the row in the alert list. A missing
      # mssql_up series can also mean the standard collector is not scraped.
      - alert: SqlServerUnavailable
        expr: |
          (
            up{job=~"sql.*"} == 1
            unless on (instance)
            (max by (instance) (mssql_up == 1))
          )
        for: 1m
        labels:
          severity: info
          priority: P3
          alert_profile: mssql
        annotations:
          summary: "SQL query up missing on {{ $labels.instance }} for 1m"
          summary_fa: "متریک mssql_up روی {{ $labels.instance }} برای 1 دقیقه نیست"
          description: "sql_exporter on {{ $labels.instance }} is up, and no mssql_up == 1 series exists for this instance."
          runbook: "Confirm whether SELECT 1 failed or the mssql_standard collector is absent. A failed scrape of the exporter itself stays on SqlExporterDown. Priority P3 is listed only and sends no SMS or email."
