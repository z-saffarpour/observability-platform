global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "127.0.0.1:9093"

rule_files:
  - "../alert-rules/sql-exporter/*.rules.yml"
  - "../alert-rules/windows-exporter/*.rules.yml"
  - "../alert-rules/prometheus-store/*.rules.yml"
  - "../recording-rules/sql-exporter/*.rules.yml"
  - "../recording-rules/windows-exporter/*.rules.yml"
  - "../recording-rules/prometheus-store/*.rules.yml"

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  # Same host as Prometheus. Email is integration="email"; SMS is webhook.
  - job_name: alertmanager
    metrics_path: /metrics
    static_configs:
      - targets:
          - "127.0.0.1:9093"

  - job_name: windows_exporter
    metrics_path: /metrics
    basic_auth:
      username: prometheus_user
      password_file: "../secrets/windows-exporter-password"
    file_sd_configs:
      - files:
          - "../targets/windows_exporter/*.json"

  - job_name: sql_exporter
    scrape_interval: 180s
    scrape_timeout: 120s
    metrics_path: /metrics
    basic_auth:
      username: prometheus_user
      password_file: "../secrets/sql-exporter-password"
    file_sd_configs:
      - files:
          - "../targets/sql_exporter/*.json"

  # Managed targets from the Target Manager; legacy file_sd remains active.
  # Replace target-manager:8080 with an address reachable from Prometheus.
  - job_name: windows_exporter_managed
    metrics_path: /metrics
    basic_auth:
      username: prometheus_user
      password_file: "../secrets/windows-exporter-password"
    http_sd_configs:
      - url: "http://target-manager:8080/api/discovery/windows_exporter"
        refresh_interval: 30s

  - job_name: sql_exporter_managed
    scrape_interval: 180s
    scrape_timeout: 120s
    metrics_path: /metrics
    basic_auth:
      username: prometheus_user
      password_file: "../secrets/sql-exporter-password"
    http_sd_configs:
      - url: "http://target-manager:8080/api/discovery/sql_exporter"
        refresh_interval: 30s
